[nodeset_a]
  nodes = 5
  override_mode = "each"
  http_port_range_start = 10100
  name = "workflow"

  [nodeset_a.db]
    image = "postgres:12.0"
    port = 13000
    volume_name = "workflow_volume"

  [[nodeset_a.node_specs]]

    [nodeset_a.node_specs.node]
      # name = "a_bootstrap"
      # docker_ctx = "../../.."
      # docker_file = "plugins/chainlink.Dockerfile"
      image = "chainlink-test"
      user_config_overrides = """
      [Feature]
			LogPoller = true

			[OCR2]
			Enabled = true
			DatabaseTimeout = '1s'

			[P2P.V2]
			Enabled = true
			ListenAddresses = ['0.0.0.0:5001']
      """

