
[blockchain_a]
  type = "anvil"
  docker_cmd_params = ["-b", "5"]

[jd]
  # change to your version
  image = "jd-test-1:latest"

[workflow_config]
	workflow_don_id = 1
  capabilities_don_id = 2
	workflow_name = "abcdefgasd"
  # without 0x prefix!
	feed_id = "018bfe8840700040000000000000000000000000000000000000000000000000"

  use_cre_cli = true
  should_compile_new_workflow = false
  workflow_folder_location = "/Users/bartektofel/Downloads/workflow_test"

  [workflow_config.dependencies]
  capabilities_version = "v1.0.0-alpha"
  cre_cli_version = "v0.0.2"

  [workflow_config.compiled_config]
    binary_url = "https://gist.githubusercontent.com/Tofel/ee56735e7814070d63c32e1c4d059a7b/raw/cb7b2a56b37e333fe0bdce07b79538c4ce332f5f/binary.wasm.br"
    config_url = "https://gist.githubusercontent.com/Tofel/f940187351ac8e3d20e7efdf984dbc5d/raw/4bb2de46661e0275ce525ca1a7cc2b5233fa2000/config.json596220333"

[nodeset_a]
  nodes = 5
  override_mode = "each"
  http_port_range_start = 10100
  name = "workflow"

  [nodeset_a.db]
    image = "postgres:12.0"
    port = 13000
    volume_name = "workflow_volume"

  [[nodeset_a.node_specs]]

    [nodeset_a.node_specs.node]
      docker_ctx = "../../.."
      docker_file = "plugins/chainlink.Dockerfile"
      user_config_overrides = """
      [Feature]
			LogPoller = true

			[OCR2]
			Enabled = true
			DatabaseTimeout = '1s'

			[P2P.V2]
			Enabled = true
			ListenAddresses = ['0.0.0.0:5001']
      """

  [[nodeset_a.node_specs]]

    [nodeset_a.node_specs.node]
      docker_ctx = "../../.."
      docker_file = "plugins/chainlink.Dockerfile"
      capabilities = ["./amd64_cron"]
      user_config_overrides = """
      [Feature]
			LogPoller = true

