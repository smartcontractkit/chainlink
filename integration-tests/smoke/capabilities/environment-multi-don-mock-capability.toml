[blockchain_a]
type = "anvil"
docker_cmd_params = ["-b", "5"]

[jd]
# change to your version
image = 'localhost:5000/job-distributor:sha-707362c-amd64'

[price_provider]
# without 0x prefix!
feed_id = "018bfe8840700040000000000000000000000000000000000000000000000000"
# used only if [data_source_config.fake] is not present
# url = "api.real-time-reserves.verinumus.io/v1/chainlink/proof-of-reserves/TrueUSD"

[price_provider.fake] #TODO @george-dorin: Remove!
port = 8171
prices = [182.9, 162.71, 172.02]

[workflow_config] #TODO @george-dorin: Remove!
workflow_name = "ccipopt002"

use_cre_cli = true
should_compile_new_workflow = false
workflow_folder_location = "/Users/ionita/chainlink/integration-tests/smoke/capabilities/workflows"

[workflow_config.dependencies]
capabilities_version = "v1.0.0-alpha"
cre_cli_version = "v0.0.2"

[workflow_config.compiled_config] #TODO @george-dorin: Remove!
binary_url = "https://gist.githubusercontent.com/Tofel/b6e7afd05de86ba0444d85894f58857b/raw/cb7b2a56b37e333fe0bdce07b79538c4ce332f5f/binary.wasm.br"
config_url = "https://gist.githubusercontent.com/Tofel/cdd80b48ef6c6faf44c10a6673043a4a/raw/871c0b69c032edb4c1371fe896c10b973a93eb06/config.json1025406406"

[[nodesets]]
capabilities = ["ocr3"]
don_type = "workflow"
nodes = 5
override_mode = "each"
http_port_range_start = 10100
name = "workflow"

[nodesets.db]
image = "postgres:12.0"
port = 13000
volume_name = "workflow_volume"

[[nodesets.node_specs]]

[nodesets.node_specs.node]
image = 'localhost:5000/chainlink:develop'
custom_ports = ['13300:3456']
user_config_overrides = """
      [Feature]
			LogPoller = true

			[OCR2]
			Enabled = true
			DatabaseTimeout = '1s'

			[P2P.V2]
			Enabled = true
			ListenAddresses = ['0.0.0.0:5001']
      """

