# Static shard assignment (manual-only) with a single shared vault DON and
# confidential workflows engine integration.
#
# Same shape as workflow-gateway-sharded-shared-vault-manual.toml, plus the
# confidential deltas from workflow-gateway-capabilities-don-confidential-workflows.toml:
#   - both workflow shards host "confidential-workflows" (routes engine execution
#     into the enclaves) and "confidential-relay" (the gateway handler the
#     enclaves call back through for secrets)
#   - PerWorkflow.ConfidentialWorkflows is enabled so the engine honours a
#     workflow registered with {"confidential":true} attributes
#   - the shards expose remote capabilities and enable the DKG recipient so the
#     pre-enclave secret fetch can reach the vault DON
#   - the syncer reads workflow binaries from disk ([CRE.WorkflowFetcher]); the
#     test copies them into the containers
#
# Enclaves are per shard: the test starts one enclave group per shard and
# publishes each group's address in that shard DON's own on-chain
# confidential-workflows capability config, so whichever shard the assignment
# routes a confidential workflow to executes it through enclaves whose signer
# set is that shard's DON. The gateway's confidential relay handler serves the
# first shard declared here (workflow-1-zone-a), so the enclave -> relay ->
# shared vault secrets leg is exercised on shard-0 executions.
#
# Family layout (see don_families):
#   workflow-1-zone-a         : don_families=["zone-a_workflows", "zone-a_shard-0"]   (shard 0; no vault capability)
#   workflow-1-zone-a-shard-1 : don_families=["zone-a_workflows", "zone-a_shard-1"]   (shard 1; no vault capability)
#   chain-capabilities-zone-a : don_families=["zone-a_shard-0", "zone-a_shard-1"]   (hosts vault; reachable by all shards)
#   bootstrap-gateway         : no don_families (gateways are reached over public URLs, not by don-family routing)
#
# ShardingFailoverEnabled is deliberately NOT set here: in this topology
# only the assigned shard syncs and runs each workflow.

# Fake enclaves emit a sentinel attestation document rather than real PCRs, so
# attestation validation is relaxed. INSECURE; for tests only.
[capability_configs.confidential-relay]
  [capability_configs.confidential-relay.values]
    trustEnclaves = true
    requireBFTQuorum = true

# The "enclaves" value is a JSON array of enclaves the capability routes to.
# The test starts one enclave group per shard and publishes each group in its
# own shard DON's capability config; absent that, a shard registers an empty
# list.
[capability_configs.confidential-workflows]
  binary_name = "confidential-workflows"
  [capability_configs.confidential-workflows.values]
    version = "1.0.0-alpha"

[chip_router]
  image = "local-cre-chip-router:v1.0.1"

[[blockchains]]
  type = "anvil"
  chain_id = "1337"
  container_name = "anvil-1337"
  docker_cmd_params = ["-b", "0.5", "--mixed-mining"]

[[blockchains]]
  type = "anvil"
  chain_id = "2337"
  container_name = "anvil-2337"
  port = "8546"
  docker_cmd_params = ["-b", "0.5", "--mixed-mining"]

[jd]
  csa_encryption_key = "d1093c0060d50a3c89c189b2e485da5a3ce57f3dcb38ab7e2c0d5f0bb2314a44"
  image = "job-distributor:0.28.0"

[fake]
  port = 8171

[fake_http]
  port = 8666

[infra]
  type = "docker"

# --- Workflow shard 0 --------------------------------------------------------
[[nodesets]]
  nodes = 4
  name = "workflow-1-zone-a"
  don_families = ["zone-a_workflows", "zone-a_shard-0"]
  don_types = ["workflow", "shard"]
  shard_index = 0
  override_mode = "each"
  http_port_range_start = 12700
  supported_evm_chains = [1337, 2337]

  env_vars = { CL_EVM_CMD = "", OTEL_SERVICE_NAME = "chainlink-node", CL_CRE_SETTINGS = '{"global":{"PerOrg":{"BaseTriggerRetransmitEnabled":"true"}}}', CL_CRE_SETTINGS_DEFAULT = '{"RemoteExecutableWorkflowDONBindingEnabled":"true","PerWorkflow":{"ConfidentialWorkflows":{"Enabled":"true"}}}' }
  capabilities = ["cron", "http-action", "http-trigger", "consensus", "don-time", "confidential-workflows", "confidential-relay"]
  exposes_remote_capabilities = true
  registry_based_launch_allowlist = ["cron-trigger@1.0.0", "dontime@1.0.0"]

  [nodesets.db]
    image = "postgres:15.0"
    port = 18700

  [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      custom_ports = ["13876:9876"]
      user_config_overrides = """
      [P2P]
      EnableExperimentalRageP2P = true

      [CRE]
      EnableDKGRecipient = true

      [Sharding]
      ShardAssignmentMode = "manual-only"

      # The test copies the workflow binary and config into the containers, so the
      # syncer reads them from disk rather than fetching them remotely.
      [CRE.WorkflowFetcher]
      URL = "file:///home/chainlink/workflows"
      """

  [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      custom_ports = ["13877:9876"]
      user_config_overrides = """
      [P2P]
      EnableExperimentalRageP2P = true

      [CRE]
      EnableDKGRecipient = true

      [Sharding]
      ShardAssignmentMode = "manual-only"

      [CRE.WorkflowFetcher]
      URL = "file:///home/chainlink/workflows"
      """

  [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      custom_ports = ["13878:9876"]
      user_config_overrides = """
      [P2P]
      EnableExperimentalRageP2P = true

      [CRE]
      EnableDKGRecipient = true

      [Sharding]
      ShardAssignmentMode = "manual-only"

      [CRE.WorkflowFetcher]
      URL = "file:///home/chainlink/workflows"
      """

  [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      custom_ports = ["13879:9876"]
      user_config_overrides = """
      [P2P]
      EnableExperimentalRageP2P = true

      [CRE]
      EnableDKGRecipient = true

      [Sharding]
      ShardAssignmentMode = "manual-only"

      [CRE.WorkflowFetcher]
      URL = "file:///home/chainlink/workflows"
      """

