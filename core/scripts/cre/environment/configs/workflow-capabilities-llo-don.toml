
[[blockchains]]
  type = "anvil"
  chain_id = "1337"
  docker_cmd_params = ["-b", "0.5", "--mixed-mining"]

[jd]
  csa_encryption_key = "d1093c0060d50a3c89c189b2e485da5a3ce57f3dcb38ab7e2c0d5f0bb2314a44" # any random 32 byte hex string
  # change to your version
  image = "job-distributor:0.22.1"

[fake]
  port = 8171

[fake_http]
  port = 8666

#[s3provider]
#  # use all defaults
#  port = 9000
#  console_port = 9001

[infra]
  # either "docker" or "crib"
  type = "docker"

#[infra.crib]
#  namespace = "crib-local"
#  folder_location = "/absolute/path/to/crib/deployments/cre"
#  provider = "kind"  # or "aws"

[[nodesets]]
  nodes = 5
  name = "workflow"
  don_types = ["workflow"]
  override_mode = "each"
  http_port_range_start = 10100

  supported_evm_chains = [1337]

  env_vars = { CL_EVM_CMD = "" }
  # Minimal capabilities for LLO streams trigger E2E test
  capabilities = ["ocr3", "consensus", "don-time"]

  [nodesets.chain_capabilities]
    # we want to write only to the home chain, so that we can test whether remote capabilities of the 'capabilities DON' are used
    write-evm = ["1337"]
    read-contract = ["1337"]
    evm = ["1337"]

  # See ./examples/workflow-don-overrides.toml to learn how to override capability configs

  [nodesets.db]
    image = "postgres:12.0"
    port = 13000

  [[nodesets.node_specs]]
    roles = ["bootstrap"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      # image = "chainlink-tmp:latest"
      user_config_overrides = ""

 [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      # image = "chainlink-tmp:latest"
      user_config_overrides = ""

 [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      # image = "chainlink-tmp:latest"
      user_config_overrides = ""

 [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      # image = "chainlink-tmp:latest"
      user_config_overrides = ""

 [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      # image = "chainlink-tmp:latest"
