# Variant of workflow-gateway-don-capacity-test.toml for workflow_capacity_test.go with the smallest
# workflow DON the registry accepts (local CRE uses F=1, the contract needs nodes >= F+1) and only the
# cron capability: below 4 nodes there is no consensus/OCR (consensus, don-time, vault). Every node runs
# every workflow, so fewer nodes fit more workflows on one machine.
# Run with CTF_CONFIGS=configs/workflow-gateway-don-capacity-test-2-nodes.toml.
[chip_router]
  image = "local-cre-chip-router:v1.0.1"

[[blockchains]]
  type = "anvil"
  chain_id = "1337"
  container_name = "anvil-1337"
  docker_cmd_params = ["-b", "0.5", "--mixed-mining"]

[[blockchains]]
  type = "anvil"
  chain_id = "2337"
  container_name = "anvil-2337"
  port = "8546"
  docker_cmd_params = ["-b", "0.5", "--mixed-mining"]

[jd]
  csa_encryption_key = "d1093c0060d50a3c89c189b2e485da5a3ce57f3dcb38ab7e2c0d5f0bb2314a44"
  image = "job-distributor:0.28.0"

[fake]
  port = 8171

[fake_http]
  port = 8666

[infra]
  type = "docker"

[[nodesets]]
  nodes = 2
  name = "workflow"
  don_families = ["test-don-family"]
  don_types = ["workflow"]
  override_mode = "all"
  http_port_range_start = 10100

  # MALLOC_ARENA_MAX caps glibc malloc arenas. Experiment: with the default, ~2.5 GiB of native memory per
  # node stayed allocated after the first burst of parallel module compiles, even with all modules evicted.
  env_vars = { CL_EVM_CMD = "", MALLOC_ARENA_MAX = "2" }
  # Local CRE's chip router answers batches without per-event results, so with the durable emitter on, every
  # telemetry event is retried forever, which inflates memory/CPU/Postgres and floods (and rotates) node logs.
  disable_durable_emitter = true
  # The registry chain is needed to read the workflow registry; no EVM capabilities are.
  supported_evm_chains = [1337]
  capabilities = ["cron"]
  registry_based_launch_allowlist = ["cron-trigger@1.0.0"]

  [nodesets.db]
    image = "postgres:15.0"
    port = 13000

[[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      user_config_overrides = """
[Capabilities.WorkflowRegistry.ModuleCache]
Enabled = true
# Modules are compiled eagerly on registration, so during a ramp only this cap bounds compiled-module memory.
MaxLoaded = 50
IdleEviction = true
# The eviction scan runs every 30s, so lower values gain nothing.
IdleTimeout = '1m'

# The on-chain DON limit set by local CRE is 5000, so going past it needs a contract-side change too.
[Workflows.Limits]
Global = 5000
PerOwner = 5000

[Log]
Level = 'info'

# No don-time capability on this DON; idle cron workflows never ask for time anyway.
[CRE]
UseLocalTimeProvider = true
"""

[[nodesets]]
  nodes = 1
  name = "bootstrap-gateway"
  don_families = ["test-don-family"]
  don_types = ["bootstrap", "gateway"]
  override_mode = "each"
  http_port_range_start = 10300

  env_vars = { CL_EVM_CMD = "" }
  disable_durable_emitter = true
  supported_evm_chains = [1337, 2337]

  [nodesets.db]
    image = "postgres:15.0"
    port = 13200

  [[nodesets.node_specs]]
    roles = ["bootstrap", "gateway"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      custom_ports = ["5002:5002","15002:15002"]
      user_config_overrides = ""
