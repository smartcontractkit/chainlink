# Custom local CRE topology for Vault KV write-budget gating smoke coverage.
# Uses a small max modified-keys budget so a single create batch's write-set
# projection deterministically straddles the per-round budget boundary: with
# VaultMaxKeyValueModifiedKeys=12 and one queue item (mandatory rewrite floor of
# 2 keys), a 9-secret create projects exactly 12 modified keys (9 secret records
# + 1 owner metadata record + floor) and must process, while a 10-secret create
# projects 13 and must defer every round. The blob payload cap is raised so the
# blob-cap limiter can never preempt the budget gate for these batches.
[chip_router]
  image = "local-cre-chip-router:v1.0.1"

[[blockchains]]
  type = "anvil"
  chain_id = "1337"
  container_name = "anvil-1337"
  docker_cmd_params = ["-b", "0.5", "--mixed-mining"]

[[blockchains]]
  type = "anvil"
  chain_id = "2337"
  container_name = "anvil-2337"
  port = "8546"
  docker_cmd_params = ["-b", "0.5", "--mixed-mining"]

[jd]
  csa_encryption_key = "d1093c0060d50a3c89c189b2e485da5a3ce57f3dcb38ab7e2c0d5f0bb2314a44"
  image = "job-distributor:0.22.1"

[fake]
  port = 8171

[fake_http]
  port = 8666

[infra]
  type = "docker"

[[nodesets]]
  nodes = 4
  name = "workflow"
  don_families = ["test-don-family"]
  don_types = ["workflow"]
  override_mode = "all"
  http_port_range_start = 10100
  supported_evm_chains = [1337, 2337]
  env_vars = { CL_EVM_CMD = "", OTEL_SERVICE_NAME = "chainlink-node", CL_CRE_SETTINGS = '{"global":{"PerOrg":{"BaseTriggerRetransmitEnabled":"true"}}}', CL_CRE_SETTINGS_DEFAULT = '{"VaultMaxKeyValueModifiedKeys":"12","VaultMaxBlobPayloadSizeLimit":"64kb"}' }
  capabilities = ["cron", "http-action", "http-trigger", "consensus", "don-time", "evm-1337"]
  registry_based_launch_allowlist = ["cron-trigger@1.0.0", "dontime@1.0.0"]

  [nodesets.db]
    image = "postgres:15.0"
    port = 13000

  [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      user_config_overrides = ""

[[nodesets]]
  nodes = 4
  name = "capabilities"
  don_families = ["test-don-family"]
  don_types = ["capabilities"]
  exposes_remote_capabilities = true
  override_mode = "all"
  http_port_range_start = 10200
  supported_evm_chains = [1337, 2337]
  env_vars = { CL_EVM_CMD = "", OTEL_SERVICE_NAME = "chainlink-node", CL_CRE_SETTINGS = '{"global":{"PerOrg":{"BaseTriggerRetransmitEnabled":"true"}}}', CL_CRE_SETTINGS_DEFAULT = '{"VaultMaxKeyValueModifiedKeys":"12","VaultMaxBlobPayloadSizeLimit":"64kb"}' }
  capabilities = ["vault", "evm-2337"]

  [nodesets.db]
    image = "postgres:15.0"
    port = 13100

  [[nodesets.node_specs]]
    roles = ["plugin"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      user_config_overrides = ""

[[nodesets]]
  nodes = 1
  name = "bootstrap-gateway"
  don_families = ["test-don-family"]
  don_types = ["bootstrap", "gateway"]
  override_mode = "each"
  http_port_range_start = 10300
  supported_evm_chains = [1337, 2337]
  env_vars = { CL_EVM_CMD = "", OTEL_SERVICE_NAME = "chainlink-node", CL_CRE_SETTINGS = '{"global":{"PerOrg":{"BaseTriggerRetransmitEnabled":"true"}}}', CL_CRE_SETTINGS_DEFAULT = '{"VaultMaxKeyValueModifiedKeys":"12","VaultMaxBlobPayloadSizeLimit":"64kb"}' }

  [nodesets.db]
    image = "postgres:15.0"
    port = 13200

  [[nodesets.node_specs]]
    roles = ["bootstrap", "gateway"]
    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      docker_build_args = { "CL_IS_PROD_BUILD" = "false" }
      custom_ports = ["5002:5002","15002:15002"]
      user_config_overrides = ""
