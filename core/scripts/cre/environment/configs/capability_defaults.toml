[capability_configs.consensus]
  binary_name = "consensus"

# Global values for consensus are optional - uses empty jobspec config by default
[capability_configs.consensus.values]
# MaxRequestSizeBytes = 200000  # Default: 100000
# RequestBatchSize = 1 # Default: 1
# MaxRequestOutcomeSize = 1000 # Default: 1000
# KeyBundleIDForValueConsensus = "" # Default: ""
#   CustomField = "value"  # Add custom fields if needed

[capability_configs.cron]
  binary_name = "cron"

# Global values for cron are optional - each one left out keeps the binary's default
[capability_configs.cron.values]
# FastestScheduleIntervalSeconds = 1 # Default: the CRE PerWorkflow.CRONTrigger.FastestScheduleInterval setting

[capability_configs.evm]
  # Defaults for the EVM capability
  # These are merged with per-DON chain_overrides
  binary_name = "evm"

[capability_configs.evm.values]
  # Durations are written as durations: these become --evm.* flags on the binary.
  LogTriggerPollInterval = "1.5s"
  ReceiverGasMinimum = 500
  # LogTriggerSendChannelBufferSize = 1000 # default 1000, omitted here to use default
  # LogTriggerLimitQueryLogSize = 1000 # default 1000, omitted here to use default
  # The chain, the forwarder and this node's account are resolved from the environment
  # the capability runs in, so they are not settings here.

[capability_configs.solana]
  binary_name = "solana"

# One binary serves both HTTP capabilities, and the gateway they talk to is
# another binary of the same module: see the http feature, which starts both.
[capability_configs.http-trigger]
  binary_name = "http"

[capability_configs.http-trigger.values]
  # 1 is gateway mode: an outbound request goes through the gateway, so that every
  # node of the DON is answered with the same thing. 0 makes each node fetch for
  # itself.
  ProxyMode = 1
  # The rest are left out to use the binary's own defaults; uncomment to override.
  # SendChannelBufferSize = 1000
  # RequestCacheTTL = 300
  # MaxAuthorizedKeysPerWorkflow = 5

[capability_configs.vault]
#  no binary path for vault, it's built-in

[capability_configs.vault.values]
  [capability_configs.vault.values.auth0]
    issuerURL = "http://host.docker.internal:18123/"
    audience = "https://vault.test.chain.link"
    tenantID = 1

[capability_configs.write-solana.values]
  # Solana Workflow configuration for write capabilities
  TxAcceptanceState = 3
  TxRetentionTimeout = "120s"
  AcceptanceTimeout = "30s"
  PollPeriod = "2s"
  SkipPreflight = true
  Local = true
  # Runtime values below are typically filled at runtime, but may be overridden
  # FromAddress = "0x0000000000000000000000000000000000000000"
  # ForwarderAddress = "0x0000000000000000000000000000000000000000"

# Aptos chain capability plugin (View + WriteReport). Runtime values are injected per chain.
[capability_configs.aptos]
  binary_name = "aptos"

[capability_configs.aptos.values]
  # These values build the Aptos capability config registered in CapReg.
  # ChainID and forwarder address are injected separately at job proposal time.
  # They are not emitted as top-level worker job-spec fields.
  RequestTimeout = "30s"
  DeltaStage = "1500ms"

[capability_configs.solana.values]
  TxAcceptanceState = 3
  TxRetentonTimeout = "120s"
  AcceptanceTimeout = "30s"
  PollPeriod = "2s"
  SkipPreflight = true
  Local = true

# Stellar chain capability plugin (read path: GetLatestLedger + ReadContract).
[capability_configs.stellar]
  binary_name = "stellar"

[capability_configs.stellar.values]
  RequestTimeout = "30s"
  DeltaStage = "15s"

[capability_configs.mock]
  binary_name = "mock"

[capability_configs.mock.values]
  Port = 7777  # Default port for mock service
