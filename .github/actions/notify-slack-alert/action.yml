name: Notify Slack Alert
description: >-
  Posts a Block Kit alert message to a Slack channel. Renders a headline, a
  detail section, and an optional extra section (after a divider), and links
  to the commit and workflow run.
inputs:
  slack_bot_token:
    description: "Slack bot token to use for posting"
    required: true
  slack_channel_id:
    description: "Slack channel ID to post to"
    required: true
  title:
    description: "Alert headline (used as the message fallback text too)"
    required: true
  body:
    description: "Main body text of the alert (mrkdwn)"
    required: true
  extra_body:
    description: "Optional additional section, rendered after a divider (mrkdwn)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build Slack payload
      id: slack-payload
      shell: bash
      env:
        SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        EXTRA_BODY: ${{ inputs.extra_body }}
      run: |
        set -euo pipefail

        PAYLOAD_FILE="${RUNNER_TEMP:-/tmp}/notify-slack-alert.json"

        jq -n \
          --arg channel "${SLACK_CHANNEL_ID}" \
          --arg title "${TITLE}" \
          --arg body "${BODY}" \
          --arg extra "${EXTRA_BODY}" \
          '{
            channel: $channel,
            text: $title,
            blocks: (
              [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*:rotating_light: " + $title + " :rotating_light:*")
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: $body
                  }
                }
              ]
              + (if $extra != "" then
                  [
                    { type: "divider" },
                    {
                      type: "section",
                      text: { type: "mrkdwn", text: $extra }
                    }
                  ]
                else [] end)
            )
          }' > "$PAYLOAD_FILE"

        echo "file=$PAYLOAD_FILE" >> "$GITHUB_OUTPUT"

    - name: Post to Slack
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        errors: true
        method: chat.postMessage
        token: ${{ inputs.slack_bot_token }}
        payload-file-path: ${{ steps.slack-payload.outputs.file }}
