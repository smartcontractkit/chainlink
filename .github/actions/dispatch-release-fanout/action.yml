name: dispatch-release-fanout
description:
  "Tell the internal deployment hub which images this release published, so it
  can open image-bump PRs in the deployment repos subscribed to them"

# The hub classifies each tag into a release channel (beta / rc / stable) and
# dispatches each subscribed deployment repo's own image-bump workflow. One
# dispatch carries every image a build published; the hub decides what is
# routed where, so this repo holds no deployment topology.
#
# The hub repository is internal and this repository is public, so its name and
# the GATI profile that reaches it are both supplied from secrets rather than
# committed here. See the README next to this file.

inputs:
  gati-profile:
    description:
      "GATI v2 token profile granting actions:write on the hub repository.
      Supply from a secret."
    required: true
  hub-repo:
    description:
      "owner/name of the hub repository to dispatch. Supply from a secret."
    required: true
  hub-workflow:
    description: "Workflow file in the hub to dispatch."
    required: false
    default: "fanout.yaml"
  hub-ref:
    description:
      "Branch in the hub to run the workflow from. The hub's own credentials
      are pinned to its default branch, so overriding this will fail its token
      request."
    required: false
    default: "main"
  producer:
    description:
      "Producer key the hub routes on. Must match a producers/<name>.yaml entry
      in the hub."
    required: false
    default: "smartcontractkit/chainlink"
  images:
    description: |
      Multiline `stream=tag` pairs, one per image this build published:

        core=2.65.1-rc.0
        ccip=2.65.1-ccip-rc.0

      `stream` must be declared by the producer in the hub. Entries with an
      empty tag are dropped, so a caller can pass an image whose build was
      skipped or failed without special-casing it.
    required: true
  correlation-id:
    description:
      "Opaque id traversing along every hop of the fan-out. Defaults to this
      run."
    required: false
  source-run-url:
    description: "URL of this run, recorded by every downstream hop."
    required: false

runs:
  using: composite
  steps:
    - name: Setup GitHub Token
      id: setup-github-token
      uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
      with:
        profile: ${{ inputs.gati-profile }}

    - name: Dispatch fan-out
      shell: bash
      env:
        GH_TOKEN: ${{ steps.setup-github-token.outputs.access-token }}
        HUB_REPO: ${{ inputs.hub-repo }}
        HUB_WORKFLOW: ${{ inputs.hub-workflow }}
        HUB_REF: ${{ inputs.hub-ref }}
        PRODUCER: ${{ inputs.producer }}
        IMAGES: ${{ inputs.images }}
        CORRELATION_ID: ${{ inputs.correlation-id }}
        SOURCE_RUN_URL: ${{ inputs.source-run-url }}
      run: |
        set -euo pipefail

        images_json="$(printf '%s\n' "${IMAGES}" | jq -Rn -c '
          [ inputs
            | gsub("^\\s+|\\s+$"; "")
            | select(length > 0)
            | split("=")
            | select(length == 2 and (.[1] | length) > 0)
            | {stream: .[0], tag: .[1]}
          ]')"

        if [[ "${images_json}" == "[]" ]]; then
          echo "::warning::No published images to fan out; nothing dispatched."
          exit 0
        fi

        correlation_id="${CORRELATION_ID:-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
        source_run_url="${SOURCE_RUN_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"

        gh workflow run "${HUB_WORKFLOW}" \
          --repo "${HUB_REPO}" \
          --ref "${HUB_REF}" \
          --field "producer=${PRODUCER}" \
          --field "images=${images_json}" \
          --field "correlation-id=${correlation_id}" \
          --field "source-run-url=${source_run_url}"

        {
          echo "### Release fan-out dispatched"
          echo
          echo "| field | value |"
          echo "| --- | --- |"
          echo "| producer | \`${PRODUCER}\` |"
          echo "| images | \`${images_json}\` |"
          echo "| correlation-id | \`${correlation_id}\` |"
        } | tee -a "$GITHUB_STEP_SUMMARY"
