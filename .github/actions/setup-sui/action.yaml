name: Setup Sui CLI
description: Install and cache Sui CLI using suiup (built from source via cargo — not the curl install.sh from raw.githubusercontent)
inputs:
  version:
    description: Sui CLI version to install (e.g., mainnet-v1.69.2)
    required: false
    default: mainnet-v1.69.2
  suiup-version:
    description: MystenLabs/suiup git tag to `cargo install` (pinned; avoids the remote install.sh script)
    required: false
    default: v0.0.13
  github-token:
    description: GitHub token to use for authentication
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      id: cache
      name: Cache Sui CLI
      with:
        path: |
          ~/.local/bin/sui
        key: ${{ runner.os }}-sui-${{ inputs.version }}-suiup-${{ inputs.suiup-version }}

    - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      name: Install suiup and Sui CLI
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        cargo install --git https://github.com/MystenLabs/suiup.git --tag "${{ inputs.suiup-version }}" --locked suiup
        "$HOME/.cargo/bin/suiup" install sui@${{ inputs.version }} --yes

    - name: Export Sui CLI to PATH
      shell: bash
      run: |
        echo "PATH=$HOME/.local/bin:$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
