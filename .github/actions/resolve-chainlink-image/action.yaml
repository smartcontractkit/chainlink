name: Resolve Chainlink image
description: Resolves the Chainlink image to use for the tests

inputs:
  chainlink_image_repo:
    description: "ECR repository name used to compose image with chainlink_image_tag (for example: chainlink-integration-tests or chainlink)."
    required: false
    default: ""
  chainlink_image_tag:
    required: false
    default: ""
    description: "Tag used with chainlink_image_repo. If empty, chainlink_version is used."
  chainlink_full_image:
    required: false
    default: ""
    description: "Full Chainlink image reference including tag or digest (for example: public.ecr.aws/chainlink/chainlink:2.0.0 or ...@sha256:<digest>). Mutually exclusive with chainlink_image_repo/chainlink_image_tag."
  chainlink_version:
    required: true
    description: "The version of Chainlink repository to use for the tests."
    default: "develop"
outputs:
  resolved_image:
    description: "Fully qualified image reference"
    value: ${{ steps.resolve-chainlink-image.outputs.resolved_image }}

runs:
  using: composite
  steps:
    - name: Resolve Chainlink image
      id: resolve-chainlink-image
      shell: bash
      env:
        INPUT_CHAINLINK_IMAGE_REPO: ${{ inputs.chainlink_image_repo }}
        INPUT_CHAINLINK_IMAGE_TAG: ${{ inputs.chainlink_image_tag }}
        INPUT_CHAINLINK_FULL_IMAGE: ${{ inputs.chainlink_full_image }}
        INPUT_CHAINLINK_VERSION: ${{ inputs.chainlink_version }}
      run: |
        set -euo pipefail

        full_image="${INPUT_CHAINLINK_FULL_IMAGE}"
        explicit_repo="${INPUT_CHAINLINK_IMAGE_REPO}"
        tag="${INPUT_CHAINLINK_IMAGE_TAG}"
        version="${INPUT_CHAINLINK_VERSION}"

        resolved_repo="${explicit_repo:-chainlink}"

        if [[ -n "${full_image}" ]]; then
          if [[ -n "${tag}" || -n "${explicit_repo}" ]]; then
            echo "::error::'chainlink_full_image' is mutually exclusive with 'chainlink_image_tag' and 'chainlink_image_repo'."
            exit 1
          fi
          if [[ ! "${full_image}" =~ .+/.+(:[^@]+|@sha256:[a-f0-9]{64})$ ]]; then
            echo "::error::Invalid 'chainlink_full_image' format: '${full_image}'. Expected '<registry>/<repo>:<tag>' or '<registry>/<repo>@sha256:<digest>'."
            exit 1
          fi
          resolved_image="${full_image}"
        else
          resolved_tag="${tag:-$version}"
          if [[ -z "${resolved_tag}" ]]; then
            echo "::error::Either provide 'chainlink_full_image' or provide a tag via 'chainlink_image_tag' (or 'chainlink_version')."
            exit 1
          fi
          resolved_image="${QA_AWS_ACCOUNT_NUMBER}.dkr.ecr.${QA_AWS_REGION}.amazonaws.com/${resolved_repo}:${resolved_tag}"
        fi

        echo "resolved_image=${resolved_image}" | tee -a "${GITHUB_OUTPUT}"
