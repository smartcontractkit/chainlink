name: CI lint for Golang
description: Runs CI lint for Golang
inputs:
  go-directory:
    description: Go directory to run commands from
    default: "."
  # setup-go inputs
  only-modules:
    description: Set to 'true' to only cache modules
    default: "false"
  cache-version:
    description: Set this to cache bust
    default: "1"
  build-cache-version:
    description: For scoping build caches to certain matrix jobs, takes precedence over cache-version
    default: ""
  build-cache-write:
    description: When to save the Go build cache (always, default-branch-only, never)
    default: "always"
  go-version-file:
    description: Set where the go version file is located at
    default: "go.mod"
  go-module-file:
    description: Set where the go module file is located at
    default: "go.sum"

outputs:
  golang-report-artifact-url:
    description: The URL to the uploaded artifact
    value: ${{ steps.upload-artifact.outputs.artifact-url }}
  golang-report-file-count:
    description: The count of files with issues in the uploaded artifact
    value: ${{ steps.print.outputs.file-count }}
  golang-report-issue-count:
    description: The count of issues in the uploaded artifact
    value: ${{ steps.print.outputs.issue-count }}
  golang-report-critical-issue-count:
    description: The count of critical issues in the uploaded artifact
    value: ${{ steps.print.outputs.critical-issue-count }}
  golang-report-per-source-count:
    description: The count of issues per source in the uploaded artifact
    value: ${{ steps.print.outputs.per-source-count }}
  golang-report-per-severity-count:
    description: The count of issues per severity in the uploaded artifact
    value: ${{ steps.print.outputs.per-severity-count }}

runs:
  using: composite
  steps:
    - name: Checkout repo (full)
      uses: actions/checkout@v7
      # Only do a full checkout on merge_groups
      if: github.event_name == 'merge_group'
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Checkout repo
      uses: actions/checkout@v7
      if: github.event_name != 'merge_group'
      with:
        persist-credentials: false
        fetch-depth: 1

    - name: Setup Go
      uses: ./.github/actions/setup-go
      with:
        only-modules: ${{ inputs.only-modules }}
        cache-version: ${{ inputs.cache-version }}
        build-cache-version: ${{ inputs.build-cache-version }}
        build-cache-write: ${{ inputs.build-cache-write }}
        go-version-file: ${{ inputs.go-version-file }}
        go-module-file: ${{ inputs.go-module-file }}

    - name: Touching core/web/assets/index.html
      shell: bash
      run: mkdir -p core/web/assets && touch core/web/assets/index.html

    - name: Set Golangci-lint working directory
      shell: bash
      id: set-working-directory
      # XXX: Don't use `.` default working directory here due to issues with the golangci-lint-action.
      run: |
        if [ "${{ inputs.go-directory }}" == "." ]; then
          echo "golangci-lint-working-directory=" >> "${GITHUB_OUTPUT}"
        else
          echo "golangci-lint-working-directory=${{ inputs.go-directory }}/" >> "${GITHUB_OUTPUT}"
        fi

    - name: Golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      env:
        # golangci-lint runs with absolute path mode: --path-mode=abs
        REPORT_PATH: ${{ github.workspace }}/${{ steps.set-working-directory.outputs.golangci-lint-working-directory }}golangci-lint-report.xml
        REPORT_PATH_JSON: ${{ github.workspace }}/${{ steps.set-working-directory.outputs.golangci-lint-working-directory }}golangci-lint-report.json
      with:
        version: v2.12.2
        only-new-issues: true
        skip-cache: true
        args: --output.checkstyle.path=${{ env.REPORT_PATH }} --output.json.path=${{ env.REPORT_PATH_JSON }}
        working-directory: ${{ steps.set-working-directory.outputs.golangci-lint-working-directory }}

    - name: Print Golangci-lint report results
      id: print
      if: failure()
      shell: bash
      env:
        REPORT_PATH: ./${{ steps.set-working-directory.outputs.golangci-lint-working-directory }}golangci-lint-report.xml
        REPORT_PATH_JSON: ./${{ steps.set-working-directory.outputs.golangci-lint-working-directory }}golangci-lint-report.json
      run: |
        cat ${REPORT_PATH}
        echo "file-count=$(jq '[.Issues[].Pos.Filename] | unique | length' ${REPORT_PATH_JSON})" | tee -a $GITHUB_OUTPUT
        echo "issue-count=$(jq '.Issues | length' ./${REPORT_PATH_JSON})" | tee -a $GITHUB_OUTPUT
        echo "critical-issue-count=$(jq '[.Issues[].Severity | select(. | IN("high", "medium"))] | length' ${REPORT_PATH_JSON})" | tee -a $GITHUB_OUTPUT
        echo 'per-source-count<<EOF' | tee -a $GITHUB_OUTPUT
        echo "$(jq -r '.Issues[].FromLinter' ${REPORT_PATH_JSON} | sort | uniq -c | sort -nr)" | tee -a $GITHUB_OUTPUT
        echo 'EOF' | tee -a $GITHUB_OUTPUT
        echo 'per-severity-count<<EOF' | tee -a $GITHUB_OUTPUT
        echo "$(jq -r '.Issues[].Severity | select(. != "") // "none"' ${REPORT_PATH_JSON} | sort | uniq -c | awk '
          /high/   {print "1 "$0}
          /medium/ {print "2 "$0}
          /low/    {print "3 "$0}
          /warn/   {print "4 "$0}
          /none/   {print "5 "$0}
          ' | sort -n | sed 's/^[1-5] //')" | tee -a $GITHUB_OUTPUT
        echo 'EOF' | tee -a $GITHUB_OUTPUT

      # Get a valid name for the upload-artifact step.
      # Avoid error: `The artifact name is not valid: <path>/<to>/<artifact>/` caused by `/`.
      # Remove trailing `/` from the directory name: `core/scripts/` -> `core/scripts`.
      # Replace remaining `/` with `-`: `core/scripts` -> `core-scripts`.
      # Assign `root` if the directory name is empty (ref: step.id: set-working-directory).
    - name: Get valid suffix for artifact name
      if: always()
      id: suffix
      shell: bash
      run: |
        go_directory=${{ steps.set-working-directory.outputs.golangci-lint-working-directory }}
        echo "Validating if directory name '$go_directory' is empty or has slashes"

        if [[ $go_directory == *\/* ]]; then
            suffix=$(echo "$go_directory" | sed 's:\/$::' | tr '/' '-')
            echo "Directory name with slashes '$go_directory' updated to a valid artifact suffix '$suffix'"
        elif [[ $go_directory == "" ]]; then
          suffix="root"
          echo "Root directory (empty string) updated to a valid artifact suffix '$suffix'"
        else
          suffix="$go_directory"
          echo "Directory name is valid for the artifact suffix: '$suffix'"
        fi

        echo "suffix=${suffix}" >> "${GITHUB_OUTPUT}"

    - name: Store Golangci-lint report artifact
      if: always()
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        # Use a unique suffix for each lint report artifact to avoid duplication errors
        name: golangci-lint-report-${{ steps.suffix.outputs.suffix }}
        # N/B: value may be empty (no slash) OR `<path>/<to>/<module>/` (with slash tat the end)
        path: ./${{ steps.set-working-directory.outputs.golangci-lint-working-directory }}golangci-lint-report.*
