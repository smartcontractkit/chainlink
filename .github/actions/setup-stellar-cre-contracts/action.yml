# Installs the Soroban toolchain and prepares a chainlink-stellar checkout for Local CRE Stellar tests to compile contracts at runtime.
name: Setup Stellar CRE contracts
description: >
  Install Rust + stellar CLI and set STELLAR_CONTRACTS_SOURCE_DIR to a writable
  copy of the pinned chainlink-stellar Go module (for `stellar contract build`).

inputs:
  working-directory:
    description: Go module directory used to resolve chainlink-stellar via go list
    required: false
    default: system-tests/lib
  rust-toolchain:
    description: Rust toolchain version (aligned with chainlink-stellar CI)
    required: false
    default: "1.93.1"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master july 2026
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Add wasm32v1-none target
      shell: bash
      run: rustup target add wasm32v1-none

    # Version + checksum are pinned inside tools/ci/install_stellar; the cache key
    # hashes that script so a version bump busts the cache automatically.
    - name: Cache Stellar CLI
      id: cache-stellar
      uses: actions/cache@v6
      with:
        path: ~/.local/bin/stellar
        key: ${{ runner.os }}-${{ runner.arch }}-stellar-cli-${{ hashFiles('tools/ci/install_stellar') }}

    - name: Install Stellar CLI
      if: steps.cache-stellar.outputs.cache-hit != 'true'
      shell: bash
      run: ${{ github.workspace }}/tools/ci/install_stellar

    # Runs on every path (fresh install AND cache hit), so a tampered/poisoned cache
    # entry is caught before the binary is ever executed. Bump STELLAR_BIN_SHA256
    # together with VERSION/SHASUM in tools/ci/install_stellar on a version change.
    - name: Verify + export Stellar CLI
      shell: bash
      env:
        STELLAR_BIN_SHA256: 3b3d4a160ab14964be7ce97bfe5782fd634faf12985c296eb3e2beec5f8e37f4
      run: |
        set -euo pipefail
        BIN="${HOME}/.local/bin/stellar"
        echo "${STELLAR_BIN_SHA256}  ${BIN}" | sha256sum --check
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        "${BIN}" --version

    - name: Prepare writable chainlink-stellar sources
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        go mod download github.com/smartcontractkit/chainlink-stellar
        MODULE_DIR="$(go list -m -f '{{.Dir}}' github.com/smartcontractkit/chainlink-stellar)"
        if [[ -z "${MODULE_DIR}" || ! -f "${MODULE_DIR}/Cargo.toml" ]]; then
          echo "failed to resolve chainlink-stellar module Dir (got: '${MODULE_DIR}')"
          exit 1
        fi
        DEST="${GITHUB_WORKSPACE}/chainlink-stellar-src"
        rm -rf "${DEST}"
        # Module cache can be read-only; copy so `stellar contract build` can write targets.
        cp -a "${MODULE_DIR}" "${DEST}"
        # Go marks module-cache files/dirs read-only (0444/0555) and `cp -a` preserves that,
        # so the copy inherits read-only perms — cargo then can't write Cargo.lock/target and
        # fails with "Permission denied". Restore owner-write across the whole tree.
        chmod -R u+w "${DEST}"
        echo "STELLAR_CONTRACTS_SOURCE_DIR=${DEST}" >> "${GITHUB_ENV}"
        echo "Prepared STELLAR_CONTRACTS_SOURCE_DIR=${DEST}"

    # The contract wasm compile (`stellar contract build`) runs later, during `go test`,
    # against the sources prepared above. This restores ~/.cargo + <src>/target beforehand
    # and saves them in the job's post step — the biggest CI-time win for these suites.
    # Must run AFTER the prepare step: it reads Cargo.lock from the copied workspace.
    - name: Cache Rust build (stellar contract wasm)
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: chainlink-stellar-src
        key: stellar-cre-contracts
