version: 2
updates:
  # Go: Dependabot still resolves the module graph, but opens no PRs.
  # Security patches are handled by our own workflow via the alerts API. See ./workflows/dependabump.yml
  - package-ecosystem: "gomod"
    directories: [ "**/*" ]
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: webpack
        versions:
          - 5.19.0
          - 5.24.2
      - dependency-name: lodash
        versions:
          - 4.17.21
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
