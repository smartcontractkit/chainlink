name: Publish Integration Test Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/holo-tests:develop

jobs:
  publish-integration-test-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Integration Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            SUITES=chaos,migration,reorg,smoke,soak,load,benchmark
