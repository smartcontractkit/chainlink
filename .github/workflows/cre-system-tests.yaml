name: CRE System Tests

on:
  workflow_dispatch:
    inputs:
      chainlink_image_repository_path:
        description:
          "ECR repository name used to compose image with chainlink_image_tag
          (for example: chainlink-integration-tests or chainlink or
          chainlink/chainlink)."
        required: true
        type: string
      chainlink_image_tag:
        required: true
        type: string
        description: "Chainlink image tag to use."
      ecr:
        required: false # defaulted
        type: choice
        options:
          - "sdlc"
          - "public"
        default: "sdlc"
        description:
          "Whether to use the SDLC or public ECR registry for the Chainlink
          image."
      chainlink_version:
        required: false
        type: string
        description:
          "The version of Chainlink repository to use for the tests. If
          empty, defaults to github.sha."
        default: ""
      mixed_env:
        required: false
        type: boolean
        default: false
        description:
          "Run in mixed-env mode: split every multi-node DON 2-2 across the PR image and a
          baseline (develop) image, and fail on any non-determinism marker."
      mixed_env_baseline_image:
        required: false
        type: string
        default: ""
        description:
          "Mixed-env only. Full baseline (develop) image ref. If empty, it is resolved from
          baseline_ref/base_ref_name, else the develop nightly."
      baseline_ref:
        required: false
        type: string
        default: ""
        description:
          "Mixed-env only. Base-branch sha this PR builds on; picks
          chainlink-integration-tests:<baseline_ref> as the baseline so the split isolates
          only the PR's changes."
      base_ref_name:
        required: false
        type: string
        default: ""
        description:
          "Mixed-env only. Base-branch name; controls the missing-image fallback (a release/*
          base skips, everything else uses the develop nightly)."
      full_matrix:
        required: false
        type: boolean
        default: false
        description:
          "Mixed-env only. Also include the chain-specific / special-topology variants (the
          nightly full sweep). Per-PR runs leave this false."
  workflow_call:
    inputs:
      chainlink_image_repository_path:
        description:
          "ECR repository name used to compose image with chainlink_image_tag
          (for example: chainlink-integration-tests or chainlink or
          chainlink/chainlink)."
        required: true
        type: string
      chainlink_image_tag:
        required: true
        type: string
        description: "Chainlink image tag to use."
      ecr:
        type: string
        required: true
        description:
          "Whether to use the SDLC (sdlc) or public ECR registry (public) for
          the Chainlink image."
      chainlink_version:
        required: false
        type: string
        description:
          "The version of Chainlink repository to use for the tests. If
          empty, defaults to github.sha."
        default: ""
      mixed_env:
        required: false
        type: boolean
        default: false
        description:
          "Run in mixed-env mode: split every multi-node DON 2-2 across the PR image and a
          baseline (develop) image, and fail on any non-determinism marker."
      mixed_env_baseline_image:
        required: false
        type: string
        default: ""
        description:
          "Mixed-env only. Full baseline (develop) image ref. If empty, it is resolved from
          baseline_ref/base_ref_name, else the develop nightly."
      baseline_ref:
        required: false
        type: string
        default: ""
        description:
          "Mixed-env only. Base-branch sha this PR builds on; picks
          chainlink-integration-tests:<baseline_ref> as the baseline so the split isolates
          only the PR's changes."
      base_ref_name:
        required: false
        type: string
        default: ""
        description:
          "Mixed-env only. Base-branch name; controls the missing-image fallback (a release/*
          base skips, everything else uses the develop nightly)."
      full_matrix:
        required: false
        type: boolean
        default: false
        description:
          "Mixed-env only. Also include the chain-specific / special-topology variants (the
          nightly full sweep). Per-PR runs leave this false."

jobs:
  define-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.define-matrix.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.chainlink_version || github.sha }}
          persist-credentials: false

      - name: Define test matrix
        id: define-matrix
        shell: bash
        run: |
          # Mixed-env mode runs a curated set on the 2-2 mixed-env topologies (see
          # docs/mixed-env.md) rather than the auto-discovered full suite; it emits its own
          # matrix and exits before the normal discovery below.
          if [[ "${{ inputs.mixed_env }}" == "true" ]]; then
            # Per-PR set: the OCR3/DON2DON-heavy EVM tests on the base mixed-env topology.
            ENTRIES='[
              {"test_name":"Test_CRE_V2_Suite_Bucket_A","topology":"mixed-env","configs":"configs/mixed-env-don.toml"},
              {"test_name":"Test_CRE_V2_Suite_Bucket_B","topology":"mixed-env","configs":"configs/mixed-env-don.toml"},
              {"test_name":"Test_CRE_V2_EVM_Read_HeavyCalls","topology":"mixed-env","configs":"configs/mixed-env-don.toml"},
              {"test_name":"Test_CRE_V2_EVM_Read_StateQueries","topology":"mixed-env","configs":"configs/mixed-env-don.toml"},
              {"test_name":"Test_CRE_V2_EVM_Read_TxArtifacts","topology":"mixed-env","configs":"configs/mixed-env-don.toml"}
            ]'
            # Nightly full sweep: add the chain-specific / special-topology variants.
            if [[ "${{ inputs.full_matrix }}" == "true" ]]; then
              FULL='[
                {"test_name":"Test_CRE_V2_Aptos_Suite","topology":"mixed-env-aptos","configs":"configs/mixed-env-aptos-don.toml"},
                {"test_name":"Test_CRE_V2_Stellar_Suite","topology":"mixed-env-stellar","configs":"configs/mixed-env-stellar-don.toml"},
                {"test_name":"Test_CRE_V2_Solana_Write","topology":"mixed-env-solana","configs":"configs/mixed-env-solana-don.toml"},
                {"test_name":"Test_CRE_V2_Solana_LogTrigger","topology":"mixed-env-solana","configs":"configs/mixed-env-solana-don.toml"},
                {"test_name":"Test_CRE_V2_Solana_Read_Accounts","topology":"mixed-env-solana","configs":"configs/mixed-env-solana-don.toml"},
                {"test_name":"Test_CRE_V2_Sharding","topology":"mixed-env-sharded","configs":"configs/mixed-env-sharded-don.toml"},
                {"test_name":"Test_CRE_V2_Module_Cache","topology":"mixed-env-cache-test","configs":"configs/mixed-env-cache-test-don.toml"},
                {"test_name":"Test_CRE_V2_HTTP_Action_Multi_Gateway","topology":"mixed-env-multi-gateway","configs":"configs/mixed-env-multi-gateway-don.toml"}
              ]'
              ENTRIES=$(jq -c -n --argjson a "$ENTRIES" --argjson b "$FULL" '$a + $b')
            fi
            matrix=$(jq -c -n \
              --argjson entries "$ENTRIES" \
              --argjson run_id "${{ github.run_id }}" \
              --arg run_attempt "${{ github.run_attempt }}" '
              $entries | to_entries | map(.value + {
                test_id: .key,
                runs_on: "runs-on=\($run_id)-\(.key)-\($run_attempt)/cpu=16/ram=64/family=m7i+m8i/spot=co/image=ubuntu24-full-x64/extras=s3-cache+tmpfs"
              })')
            echo "matrix=$matrix" | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi

          TOPOLOGIES_JSON='[
            {"topology":"workflow-gateway-capabilities","configs":"configs/workflow-gateway-capabilities-don.toml"}
          ]'

          PER_TEST_TOPOLOGIES_JSON='{
            "Test_CRE_V2_Suite_Bucket_B": [
               {"topology":"workflow-gateway-capabilities","configs":"configs/workflow-gateway-capabilities-don.toml"},
               {"topology":"workflow-gateway-capabilities-vault-jwt_auth-enabled","configs":"configs/workflow-gateway-capabilities-don-vault-jwt_auth-enabled.toml"},
               {"topology":"workflow-gateway-capabilities-vault-optimizations-enabled","configs":"configs/workflow-gateway-capabilities-don-vault-optimizations-enabled.toml"},
               {"topology":"workflow-gateway-capabilities-vault-stall-purge","configs":"configs/workflow-gateway-capabilities-don-vault-stall-purge.toml"}
             ],
            "Test_CRE_V2_Aptos_Suite": [
               {"topology":"workflow-gateway-aptos","configs":"configs/workflow-gateway-don-aptos.toml"}
             ],
            "Test_CRE_V2_Stellar_Suite": [
               {"topology":"workflow-gateway-stellar","configs":"configs/workflow-gateway-don-stellar.toml"}
             ],
            "Test_CRE_V2_Solana_Write": [
               {"topology":"workflow","configs":"configs/workflow-don-solana.toml"}
             ],
            "Test_CRE_V2_Solana_LogTrigger": [
               {"topology":"workflow","configs":"configs/workflow-don-solana.toml"}
             ],
            "Test_CRE_V2_Solana_Read_Accounts": [
               {"topology":"workflow","configs":"configs/workflow-don-solana.toml"}
             ],
          "Test_CRE_V2_Solana_Read_Block": [
               {"topology":"workflow","configs":"configs/workflow-don-solana.toml"}
             ],
          "Test_CRE_V2_Solana_Read_Tx": [
               {"topology":"workflow","configs":"configs/workflow-don-solana.toml"}
             ],
            "Test_CRE_V2_Sharding": [
               {"topology":"workflow-gateway-sharded","configs":"configs/workflow-gateway-sharded-don.toml"}
             ],
            "Test_CRE_V2_ShardManualAssignment": [
               {"topology":"workflow-gateway-sharded-manual","configs":"configs/workflow-gateway-sharded-manual.toml"}
             ],
            "Test_CRE_V2_ShardRingOCROverrides": [
               {"topology":"workflow-gateway-sharded-ringocr-overrides","configs":"configs/workflow-gateway-sharded-ringocr-overrides.toml"}
             ],
            "Test_CRE_V2_Module_Cache": [
               {"topology":"workflow-gateway-cache-test","configs":"configs/workflow-gateway-don-cache-test.toml"}
             ],
            "Test_CRE_V2_HTTP_Action_Multi_Gateway": [
               {"topology":"workflow-gateway-capabilities-multi-gateway","configs":"configs/workflow-gateway-capabilities-multi-gateway-don.toml"}
             ]
          }'

          test_names=$(grep -rh -oP '^func \K(Test|Example)[^(]+' system-tests/tests/smoke/cre/*_test.go | grep -v Test_Upgrade | grep -v '^TestMain$')

          tests=$(echo "$test_names" | jq -c -R -s \
            --argjson run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --argjson tops "$TOPOLOGIES_JSON" \
            --argjson per "$PER_TEST_TOPOLOGIES_JSON" '
            (split("\n") | map(select(length>0))) as $names
            | [ $names[] as $name | $tops[] | {test_name:$name} + . ] as $baseAll
            | ($baseAll | map(select(.test_name as $n | ($per[$n] | type) == "array" | not))) as $base
            | [ $per | to_entries[] as $e
                | $e.value[] | {test_name: $e.key} + .
              ] as $extra
            | ($base + $extra)
            | to_entries
            | map(.value + {
                test_id: .key,
                runs_on: "runs-on=\($run_id)-\(.key)-\($run_attempt)/cpu=16/ram=64/family=m7i+m8i/spot=co/image=ubuntu24-full-x64/extras=s3-cache+tmpfs"
              })
          ')

          echo "matrix=$tests" | tee -a "${GITHUB_OUTPUT}"

  run-system-tests:
    name: ${{ matrix.tests.test_name }} ${{ matrix.tests.topology != '' && format(' ({0})', matrix.tests.topology) || '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        tests: ${{fromJson(needs.define-test-matrix.outputs.matrix)}}
    needs: [define-test-matrix]
    # we need a `test_id` and `run_attempt` here to stop runner stealing
    # see: https://runs-on.com/guides/troubleshoot/#runner-stealing-and-matrix-jobs
    runs-on: ${{ matrix.tests.runs_on }}
    environment:
      # http://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments#using-environments-without-deployments
      name: integration
      deployment: false
    timeout-minutes: 10
    env:
      ENABLE_AUTO_QUARANTINE: "true"
      BILLING_PLATFORM_SERVICE_IMAGE:
        ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{
        secrets.QA_AWS_REGION }}.amazonaws.com/billing-platform-service:v1.57.1
      CHAINLINK_IMAGE_FULL: ${{ inputs.ecr == 'public' && format('public.ecr.aws/{0}:{1}', inputs.chainlink_image_repository_path, inputs.chainlink_image_tag) || format('{0}.dkr.ecr.{1}.amazonaws.com/{2}:{3}', secrets.QA_AWS_ACCOUNT_NUMBER, secrets.QA_AWS_REGION, inputs.chainlink_image_repository_path, inputs.chainlink_image_tag) }}
      CTF_CHIP_INGRESS_IMAGE: ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/atlas-chip-ingress:da84cb72d3a160e02896247d46ab4b9806ebee2f
      CTF_CHIP_CONFIG_IMAGE: ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/atlas-chip-config:7b4e9ee68fd1c737dd3480b5a3ced0188f29b969

    steps:
      - name: Enable S3 Cache for Self-Hosted Runners
        uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc # v2.2.0

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.chainlink_version || github.sha }}
          persist-credentials: false

      - name: Set up Go
        id: setup-go
        uses: smartcontractkit/.github/actions/ctf-setup-go@fa1d48a33e24f9b3b9f8c52e99a578a4597cb2a5 # v0.4.0
        with:
          go_mod_path: system-tests/tests/go.mod
          no_cache: true

      - name: Restore Pre-Compiled Test Binaries from S3 Cache
        uses: actions/cache/restore@v6
        with:
          path: system-tests/tests/bin/
          key: test-binaries-cre-${{ inputs.chainlink_version || github.sha }}

      # Required to pull Job Distributor (main), Chip Ingress (main) and Chainlink (sdlc) private images
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ secrets.QA_AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_CTF_READ_ACCESS_ROLE_ARN }}
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registries: ${{ format('{0},{1}', secrets.QA_AWS_ACCOUNT_NUMBER,
            secrets.AWS_ACCOUNT_ID_PROD) }}
        env:
          AWS_REGION: ${{ secrets.QA_AWS_REGION }}

      # Required to allow pulling public images
      - name: Authenticate to ECR (public)
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public
        env:
          AWS_REGION: us-east-1

      - name: Cache gotestsum
        id: cache-gotestsum
        uses: actions/cache@v6
        with:
          path: ~/go/bin/gotestsum
          key: ${{ runner.os }}-${{ runner.arch }}-gotestsum-1.13.0

      - name: Set up gotestsum
        shell: bash
        run: |
          if [ -f ~/go/bin/gotestsum ]; then
            echo "Using cached gotestsum"
          else
            echo "::group::Install gotestsum"
            go install gotest.tools/gotestsum@v1.13.0
            echo "::endgroup::"
          fi

      - name: Setup Aptos CLI
        if: ${{ matrix.tests.test_name == 'Test_CRE_V2_Aptos_Suite' }}
        uses: ./.github/actions/setup-aptos
        with:
          version: "7.8.0"

      - name: Start observability stack (Beholder suite)
        if: contains(matrix.tests.test_name, 'Beholder_Suite')
        shell: bash
        working-directory: core/scripts/cre/environment
        env:
          TEST_NAME: ${{ matrix.tests.test_name }}
          OBS_MAX_ATTEMPTS: "3"
          OBS_RETRY_DELAY_SECONDS: "15"
        run: |
          set -u
          set +e
          # GitHub runs bash with errexit (-e); allow obs up / validation paths to fail without aborting retries.
          attempt=1
          while [[ "$attempt" -le "$OBS_MAX_ATTEMPTS" ]]; do
            if [[ "$attempt" -gt 1 ]]; then
              echo "Tearing down observability stack before retry (attempt ${attempt}/${OBS_MAX_ATTEMPTS})..."
              go run . obs down || true
              sleep "$OBS_RETRY_DELAY_SECONDS"
            fi

            echo "::group::Starting Observability Stack (attempt ${attempt}/${OBS_MAX_ATTEMPTS})"
            echo "Test requires observability stack for '${TEST_NAME}', starting..."
            go run . obs up -f
            obs_up_exit=$?
            echo "::endgroup::"

            if [[ "$obs_up_exit" -ne 0 ]]; then
              echo "❌ ERROR: obs up failed with exit code ${obs_up_exit}"
              if [[ "$attempt" -ge "$OBS_MAX_ATTEMPTS" ]]; then
                exit 1
              fi
              attempt=$((attempt + 1))
              continue
            fi

            echo "::group::Validating Observability Stack"

            echo "Waiting for Loki to be available at http://localhost:3030..."
            loki_ready=false
            for _ in {1..30}; do
              if curl -s http://localhost:3030/ready >/dev/null 2>&1; then
                echo "✅ Loki is ready at http://localhost:3030"
                loki_ready=true
                break
              fi
              sleep 1
            done

            if [[ "$loki_ready" == "false" ]]; then
              echo "❌ ERROR: Loki failed to become ready after 30 seconds"
              docker ps -a || true
              echo "::endgroup::"
              if [[ "$attempt" -ge "$OBS_MAX_ATTEMPTS" ]]; then
                exit 1
              fi
              attempt=$((attempt + 1))
              continue
            fi

            echo "Validating OTel collector on port 4317..."
            if docker ps --filter "name=otel-collector" --format "{{.Names}}" | grep -q "otel-collector"; then
              echo "✅ OTel collector container is running"
              echo "::endgroup::"
              exit 0
            fi

            echo "❌ ERROR: OTel collector container not found"
            docker ps -a
            echo "::endgroup::"
            if [[ "$attempt" -ge "$OBS_MAX_ATTEMPTS" ]]; then
              exit 1
            fi
            attempt=$((attempt + 1))
            continue
          done
          exit 1

      # --- mixed-env only: resolve the baseline (develop side) image ---
      - name: Resolve mixed-env baseline (develop side) image
        id: baseline
        if: ${{ inputs.mixed_env }}
        shell: bash
        env:
          BASELINE_IMAGE_OVERRIDE: ${{ inputs.mixed_env_baseline_image }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          BASE_REF_NAME: ${{ inputs.base_ref_name }}
          ECR_ACCOUNT: ${{ secrets.QA_AWS_ACCOUNT_NUMBER }}
          ECR_REGION: ${{ secrets.QA_AWS_REGION }}
        run: |
          REGISTRY="${ECR_ACCOUNT}.dkr.ecr.${ECR_REGION}.amazonaws.com"
          skip=false
          image=""
          if [[ -n "${BASELINE_IMAGE_OVERRIDE}" ]]; then
            # Explicit override (e.g. the nightly sweep pins a previous nightly).
            image="${BASELINE_IMAGE_OVERRIDE}"
          elif [[ -n "${BASELINE_REF}" ]] && docker manifest inspect "${REGISTRY}/chainlink-integration-tests:${BASELINE_REF}" >/dev/null 2>&1; then
            # The exact base-branch commit this PR builds on, so the 2-2 split isolates only
            # the PR's changes. Works for any base branch (develop or release).
            image="${REGISTRY}/chainlink-integration-tests:${BASELINE_REF}"
          elif [[ "${BASE_REF_NAME}" == release/* ]]; then
            # Release base with no published base image: no correct baseline (the develop
            # nightly would be the wrong branch), so skip rather than mislead.
            echo "::warning::No baseline image for release base '${BASE_REF_NAME}'; skipping mixed-env to avoid comparing a release base against develop."
            skip=true
          else
            # develop base, non-PR run, or a stacked feature branch -> develop nightly.
            DATE="$(date +'%Y%m%d')"
            image="${REGISTRY}/chainlink:nightly-${DATE}"
          fi
          {
            echo "skip=${skip}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"
          if [[ "${skip}" == "true" ]]; then
            echo "Mixed-env skipped (no valid baseline for base branch '${BASE_REF_NAME}')."
          else
            echo "Baseline (develop side) image: ${image}"
          fi

      - name: Verify images exist & render mixed-env topology
        if: ${{ inputs.mixed_env && steps.baseline.outputs.skip != 'true' }}
        working-directory: core/scripts/cre/environment
        shell: bash
        env:
          CRE_PR_IMAGE: ${{ env.CHAINLINK_IMAGE_FULL }}
          CRE_BASELINE_IMAGE: ${{ steps.baseline.outputs.image }}
        run: |
          export CRE_PR_IMAGE CRE_BASELINE_IMAGE
          echo "PR image:       ${CRE_PR_IMAGE}"
          echo "Baseline image: ${CRE_BASELINE_IMAGE}"
          echo "Config:         ${{ matrix.tests.configs }}"
          # Fail fast with a clear error if either image is missing from the registry.
          missing=0
          for img in "${CRE_PR_IMAGE}" "${CRE_BASELINE_IMAGE}"; do
            if docker manifest inspect "${img}" >/dev/null 2>&1; then
              echo "Found image: ${img}"
            else
              echo "::error::Required mixed-env image is not available in the registry: ${img}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Re-run once the image is available, or override the develop side via the mixed_env_baseline_image input."
            exit 1
          fi
          bash configs/render-mixed-env.sh "${{ matrix.tests.configs }}"

      - name: Start local CRE${{ matrix.tests.cre_version }}
        id: start-local-cre
        # Skip only in mixed-env mode when there is no valid baseline (see resolve step).
        if: ${{ !inputs.mixed_env || steps.baseline.outputs.skip != 'true' }}
        uses: ./.github/actions/start-local-cre-environment
        with:
          jd-image:
            "${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION
            }}.amazonaws.com/job-distributor:0.28.0"
          # Mixed-env bakes per-node images into the rendered TOML, so the single image must
          # be empty (a non-empty value forces every node onto one image). !cond && A || ''
          # avoids the empty-string-is-falsy ternary trap.
          chainlink-image: "${{ !inputs.mixed_env && env.CHAINLINK_IMAGE_FULL || '' }}"
          chip-router-image: "${{ secrets.QA_AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{
            secrets.QA_AWS_REGION }}.amazonaws.com/local-cre-chip-router:v1.0.1"
          ctf-configs: ${{ matrix.tests.configs }}
          retry-count: "3"
          retry-delay-seconds: "15"
          cleanup-on-error: "false"
          working-directory: core/scripts/cre/environment

      - name: Setup GitHub token using GATI
        id: github-token
        if: ${{ !inputs.mixed_env || steps.baseline.outputs.skip != 'true' }}
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
        with:
          aws-role-arn: ${{ secrets.AWS_OIDC_CHAINLINK_READ_ONLY_TOKEN_ISSUER_ROLE_ARN }}
          aws-lambda-url: ${{ secrets.AWS_INFRA_RELENG_TOKEN_ISSUER_LAMBDA_URL }}
          aws-region: us-west-2
          aws-role-duration-seconds: "1800"
          set-git-config: "true"

      - name: Run CRE Smoke system tests
        id: run-tests
        if: ${{ !inputs.mixed_env || steps.baseline.outputs.skip != 'true' }}
        shell: bash
        working-directory: system-tests/tests
        continue-on-error: ${{ env.ENABLE_AUTO_QUARANTINE == 'true' }}
        env:
          TEST_NAME: ${{ matrix.tests.test_name }}
          TEST_TIMEOUT: 7m # let's leave 3 minutes for other steps (the whole job times out after 10 minutes)
          RUN_QUARANTINED_TESTS: "true" # always run quarantined tests in CI
          TOPOLOGY_NAME: ${{ matrix.tests.topology }}
          GITHUB_TOKEN: ${{ steps.github-token.outputs.access-token || '' }} # to avoid rate limiting when downloading protobuf files from GitHub
          PARALLEL_COUNT: "10"
          CRE_TEST_PARALLEL_ENABLED: "true"
        run: |
          echo "Starting test: '${TEST_NAME}'"
          if [ -f "./bin/cre-smoke.test" ]; then
            echo "Using precompiled binary"
            (
              cd smoke/cre && \
              gotestsum \
                --jsonfile=/tmp/gotest.log \
                --junitfile=/tmp/junit-report.xml \
                --format=github-actions \
                --raw-command -- \
                go tool test2json -t -p github.com/smartcontractkit/chainlink/system-tests/tests/smoke/cre ../../bin/cre-smoke.test -test.v -test.run "^(${TEST_NAME})$" -test.timeout "${TEST_TIMEOUT}" -test.count=1 -test.parallel="${PARALLEL_COUNT}"
            )
          else
            echo "No precompiled binary found. Building from scratch..."
            gotestsum \
              --jsonfile=/tmp/gotest.log \
              --junitfile=/tmp/junit-report.xml \
              --format=github-actions \
              -- \
              -v -run "^(${TEST_NAME})$" -timeout "${TEST_TIMEOUT}" -count=1 -parallel="${PARALLEL_COUNT}" \
              github.com/smartcontractkit/chainlink/system-tests/tests/smoke/cre
          fi

          exit_code="$?"
          if [ "$exit_code" -eq 0 ]; then
            echo "tests_result=✅ Tests passed" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check for non-determinism (mixed-env)
        # Hard gate (mixed-env only). The smoke step above is continue-on-error
        # (auto-quarantine), which would swallow the in-test TestMain scan, so re-scan the
        # live node containers here and fail the job on any marker. Reuses the pre-compiled
        # cre-smoke.test binary — TestMain runs the container scan after m.Run() and exits
        # non-zero on any marker, so a non-matching -test.run triggers the scan with no Go
        # build. Falls back to `go run` only if the binary is missing.
        if: ${{ always() && inputs.mixed_env && steps.baseline.outputs.skip != 'true' }}
        shell: bash
        working-directory: system-tests/tests
        env:
          CRE_NONDETERMINISM_CHECK: "true"
        run: |
          if [ -f "./bin/cre-smoke.test" ]; then
            echo "Scanning via pre-compiled binary (no Go build)"
            ./bin/cre-smoke.test -test.run '^$' -test.v
          else
            echo "No pre-compiled binary; falling back to 'go run'"
            go run ./cmd/mixed-env-nondeterminism-check
          fi

      - name:
          Analyze and upload test results (${{ steps.run-tests.outputs.tests_result
          }})
        if: ${{ !cancelled() }}
        uses: smartcontractkit/.github/actions/branch-out-upload@branch-out-upload/v1
        with:
          junit-file-path: "/tmp/junit-report.xml"
          trunk-org-slug: chainlink
          trunk-token: ${{ secrets.TRUNK_API_KEY }}
          trunk-previous-step-outcome: ${{ steps.run-tests.outcome }}
          # when auto-quarantine is enabled, allow this to determine test failures
          trunk-upload-only: ${{ env.ENABLE_AUTO_QUARANTINE != 'true' }}
          # unique name per matrix job to avoid 409 conflict when multiple jobs upload in the same workflow run
          artifact-name: ${{ matrix.tests.test_id }}_test_logs

      - name: Show Docker containers status
        if: failure() || cancelled()
        shell: bash
        run: docker ps -a

      - name: Save Smoke tests Docker logs
        if: failure() || cancelled()
        shell: bash
        working-directory: system-tests/tests/smoke/cre
        run: |
          mkdir -p logs
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "logs/${c}.log" 2>&1
          done
          for c in $(docker ps -a --filter "label=com.docker.compose.service=billing-platform-service" --format '{{.Names}}'); do
            docker logs "$c" > "logs/${c}.log" 2>&1
          done

      - name: Upload all artifacts as single package
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.tests.test_name }}-${{ matrix.tests.topology }}
          path: |
            ./system-tests/tests/smoke/cre/logs/
            ./system-tests/tests/load/cre/logs/
            /tmp/gotest.log
            /tmp/junit-report.xml
