name: Lint GH Workflows

on:
  pull_request:
    paths:
      - ".github/workflows/*.y*ml"
      - ".github/actions/**/action.y*ml"
      - ".github/actionlint.yml"

permissions: {}

jobs:
  lint_workflows:
    name: Validate Github Action Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Check out Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install actionlint and reviewdog
        shell: bash
        run: |
          go install actionlint.kjanat.dev/cmd/actionlint@latest
          go install github.com/reviewdog/reviewdog/cmd/reviewdog@latest

      - name: Run actionlint with reviewdog
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          actionlint -oneline | reviewdog -f=actionlint -reporter=github-pr-check -filter-mode=nofilter -fail-level=error
