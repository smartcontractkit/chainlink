name: Docker Build

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  pull_request:
  push:
    branches:
      - develop
      - release/**
  workflow_dispatch:
    inputs:
      git-ref:
        description: "The git ref to check out"
        required: true
        default: "develop"

concurrency:
  group: "docker-build-${{ github.event_name }}-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-24.04
    outputs:
      should-run: >-
        ${{
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.pr-labels.outputs.check-label-found == 'true'
        }}
      checked-out-sha: ${{ steps.checkout-sha.outputs.checked-out-sha }}
      version-tag: ${{ steps.version-info.outputs.version-tag }}

    steps:
      - name: Get PR Labels
        id: pr-labels
        uses: actions-ecosystem/action-get-labels@v1
        with:
          labels: "build-publish"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git-ref || github.sha }}

      - name: Resolve checked out SHA
        id: checkout-sha
        run: echo "checked-out-sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Version Info
        id: version-info
        run: |
          pkg_version=$(jq -r '.version' ./package.json 2>/dev/null || echo "dev")
          version_tag="${pkg_version}-dev"
          echo "version-tag=${version_tag}" >> $GITHUB_OUTPUT

  docker-build:
    needs: init
    if: ${{ needs.init.outputs.should-run == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: core
            dockerfile: core/chainlink.Dockerfile
            suffix: ""
          - name: core-plugins
            dockerfile: plugins/chainlink.Dockerfile
            suffix: "-plugins"
          - name: core-plugins-testing
            dockerfile: plugins/chainlink.Dockerfile
            suffix: "-plugins-testing"
          - name: ccip
            dockerfile: core/chainlink.Dockerfile
            suffix: ""
          - name: ccip-plugins
            dockerfile: plugins/chainlink.Dockerfile
            suffix: "-plugins"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            localhost/chainlink-${{ matrix.name }}${{ matrix.suffix }}:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            CHAINLINK_USER=chainlink
            COMMIT_SHA=${{ needs.init.outputs.checked-out-sha }}
            VERSION_TAG=${{ needs.init.outputs.version-tag }}
            CL_INSTALL_PRIVATE_PLUGINS=true
            CL_INSTALL_TESTING_PLUGINS=${{ matrix.name == 'core-plugins-testing' && 'true' || 'false' }}
            CL_CHAIN_DEFAULTS=${{ contains(matrix.name, 'ccip') && '/ccip-config' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image
        run: |
          IMAGE_NAME="localhost/chainlink-${{ matrix.name }}${{ matrix.suffix }}"
          docker image ls $IMAGE_NAME
          echo "✅ Successfully built: $IMAGE_NAME"

      - name: Job Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Docker Build - ${{ matrix.name }}${{ matrix.suffix }}

          Status: ${{ job.status }}
          Push: Disabled (Fork Mode)
          Dockerfile: ${{ matrix.dockerfile }}
          EOF
