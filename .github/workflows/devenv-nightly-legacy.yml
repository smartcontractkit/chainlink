name: (Nightly) Legacy System Tests Matrix

on:
  push:
  schedule:
    - cron: "0 6 * * *" # Run daily at 6 AM
  workflow_dispatch:

defaults:
  run:
    working-directory: devenv

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.display_name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # quick feature tests
          - display_name: "Test Multiple JobDistributors"
            test_name: "TestMultipleJobDistributors"
            envcmd: "cl u env.toml,products/ocr2/basic.toml"
            runner: "ubuntu-latest"
            working_directory: "devenv/tests/features"
          - display_name: "Test Reorg Finality Violation"
            test_name: "TestReorgHeadTrackerFinalityViolation"
            envcmd: "cl u env.toml,env-geth.toml,products/ocr2/basic.toml"
            runner: "ubuntu-latest"
            working_directory: "devenv/tests/features"
          # smoke tests
          - display_name: "Test Cron Smoke"
            test_name: "TestSmoke"
            envcmd: "cl u env.toml,products/cron/basic.toml"
            runner: "ubuntu-latest"
            working_directory: "devenv/tests/cron"
          - display_name: "Test Direct Request Smoke"
            test_name: "TestSmoke"
            envcmd: "cl u env.toml,products/directrequest/basic.toml"
            runner: "ubuntu-latest"
            working_directory: "devenv/tests/directrequest"
          - display_name: "Test Flux Smoke"
            test_name: "TestSmoke"
            envcmd: "cl u env.toml,products/flux/basic.toml"
            runner: "ubuntu-latest"
            working_directory: "devenv/tests/flux"
          # long-running
          - display_name: "Test DF1 (OCR2) Soak"
            test_name: "TestOCR2Soak/clean"
            envcmd: "cl u env.toml,products/ocr2/basic.toml,products/ocr2/soak.toml; cl obs up -f"
            runner: "ubuntu24.04-16cores-64GB"
            working_directory: "devenv/tests/ocr2"
          - display_name: "Test DF1 (OCR2) Chaos"
            test_name: "TestOCR2Chaos"
            envcmd: "cl u env.toml,products/ocr2/basic.toml; cl obs up -f"
            runner: "ubuntu24.04-16cores-64GB"
            working_directory: "devenv/tests/ocr2"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
        with:
          just-version: "1.40.0"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_IAM_ROLE_SDLC_ECR_READONLY_ARN }}
          aws-region: us-west-2

      - name: Authenticate to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Go
        uses: actions/setup-go@v6 # v6
        with:
          cache: true
          go-version-file: devenv/go.mod
          cache-dependency-path: devenv/go.sum

      - name: Download Go dependencies
        run: |
          go mod download

      - name: Set environment variables
        id: set-env
        run: |
          echo "CHAINLINK_IMAGE=${{ secrets.REGISTRY_SDLC }}/chainlink:nightly-$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Setup environment
        env:
          FAKE_SERVER_IMAGE: ${{ secrets.FAKE_SERVER_IMAGE }}
        run: |
          cd cmd/cl && go install . && cd -
          ENV_CMD="${{ matrix.envcmd }}"
          echo "Setting up environment with: $ENV_CMD"
          $ENV_CMD

      - name: Run tests
        working-directory: ${{ matrix.working_directory }}
        env:
          CURRENT_TEST: ${{ matrix.test_name }}
        run: |
          # Use workflow dispatch test_name if provided, otherwise use matrix test_name
          TEST_TO_RUN="${{ github.event.inputs.test_name || matrix.test_name }}"

          echo "Running tests for: $CHAINLINK_IMAGE, test: $TEST_TO_RUN"
          go test -v -run "$TEST_TO_RUN"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs-${{ matrix.test_name }}
          path: ${{ matrix.working_directory }}/logs
          retention-days: 3
