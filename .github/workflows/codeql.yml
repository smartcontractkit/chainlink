# .github/workflows/codeql-advanced.yml
name: "CodeQL Advanced"

on:
  push:
    branches:
      - develop
      - "release/*"
  pull_request:
    # Run on all PR activity (default types are sufficient)
    branches:
      - develop
      - "release/*"
  merge_group:
  schedule:
    - cron: "22 22 * * 2"  # Every Tuesday at 22:22 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-config:
    runs-on: ubuntu-latest
    outputs:
      go-runner: ${{ steps.set.outputs.runner }}
    steps:
      - name: Set Go runner (self-hosted when available)
        id: set
        run: |
          # Use your self-hosted Go-optimized runner when on push/schedule/merge_group
          if [[ "${{ github.event_name }}" != "pull_request"; then
            echo "runner=runs-on=${{ github.run_id }}/cpu=16/ram=64/family=c7g/image=ubuntu24-go" >> $GITHUB_OUTPUT
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
          fi

  analyze:
    name: CodeQL – ${{ matrix.language }}
    needs: runner-config
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    permissions:
      security-events: write   # Required to upload SARIF results
      packages: read           # For private CodeQL packs (if any)
      actions: read            # Recommended for actions language
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

          - language: go
            build-mode: manual
            runs-on: ${{ needs.runner-config.outputs.go-runner }}

          - language: javascript-typescript
            build-mode: none
            config-file: .github/codeql/config-js.yml  # Optional: external config

          - language: python
            build-mode: none

    steps:
      - name: Enable S3 Cache (self-hosted runners only)
        if: runner.arch == 'ARM64' || contains(runner.name, 'self-hosted')
        uses: runs-on/action@66d4449b717b5462159659523d1241051ff470b9 # v1
        with:
          cache-prefix: codeql

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for accurate CodeQL analysis

      - name: Setup Go (only for Go analysis)
        if: matrix.language == 'go'
        uses: ./.github/actions/setup-go
        with:
          restore-build-cache-only: ${{ github.event_name != 'push' && github.event_name != 'schedule' }}
          build-cache-version: "codeql-${{ github.run_id }}"

      # Workaround: CodeQL Go extractor fails if no web assets exist
      - name: Create dummy web assets (Go workaround)
        if: matrix.language == 'go'
        run: |
          mkdir -p core/web/assets
          echo "<html><body>CodeQL placeholder</body></html>" > core/web/assets/index.html

      - name: Initialize CodeQL
        uses: github/codeql-action@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ${{ matrix.config-file || '' }}
          queries: +security-and-quality
          # Optional: custom queries
          # queries: .github/codeql/custom-queries

      - name: Autobuild (for compiled languages)
        if: matrix.build-mode != 'none'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
          cleanup-level: full      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: ${{ matrix.codeql-config || '' }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      - name: Build go code manually
        if: matrix.language == 'go'
        run: |
          echo "::group::Builing all go code (go build ./...)"
          go build ./...
          echo "::endgroup::"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  runner-config:
    name: Runner Config
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    env:
      SH_GO_RUNNER: runs-on=${{ github.run_id }}/cpu=32/ram=64/family=c6i/spot=false/extras=s3-cache+tmpfs
      GH_GO_RUNNER: ubuntu24.04-8cores-32GB
    outputs:
      go-runner: ${{ steps.go-codeql.outputs.go-runner }}
    steps:
      - name: Get PR Labels
        id: pr-labels
        uses: smartcontractkit/.github/actions/get-pr-labels@get-pr-labels/v1
        with:
          check-label: "runs-on-opt-out"

      - name: Select runners for go codeql
        id: go-codeql
        shell: bash
        env:
          OPT_OUT: ${{ steps.pr-labels.outputs.check-label-found || 'false' }}
        run: |
          if [[ "$OPT_OUT" == "true" ]]; then
            echo "Opt-out is true for current run. Using gh-hosted runner for Go codeql."
            echo "go-runner=${GH_GO_RUNNER}" | tee -a $GITHUB_OUTPUT
            exit 0
          fi

          echo "Opt-out is false for current run. Using self-hosted runner for Go codeql."
          echo "go-is-self-hosted=true" | tee -a $GITHUB_OUTPUT
          echo "go-runner=${SH_GO_RUNNER}" | tee -a $GITHUB_OUTPUT
