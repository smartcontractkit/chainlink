name: Run Nightly In-Memory Integration Tests

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      chainlink_version:
        description: 'Enter Chainlink version to use for the tests. Example: "v2.10.0" or sha'
        required: true
        type: string
        default: develop

permissions:
  contents: read
  # A called workflow cannot elevate above the caller's permissions, and
  # integration-in-memory-tests.yml's compile-tests job needs id-token: write to mint an
  # OIDC token for GATI.
  id-token: write

permissions:
  id-token: write
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  in-memory-tests:
    uses: ./.github/workflows/integration-in-memory-tests.yml
    with:
      chainlink_version: ${{ inputs.chainlink_version || 'develop' }}
      slack_channel_id: "#team-test-tooling-internal"
    secrets: inherit
