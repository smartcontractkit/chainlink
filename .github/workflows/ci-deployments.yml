name: Deployment Tests
run-name: Deployment Tests

concurrency:
  group: deployment-tests-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - "release/*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0,1,2,3,4,5,6,20,21,22,23 * * *"

jobs:
  filter:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should-run: >-
        ${{ 
          steps.filter.outputs.deployment == 'true' ||
          steps.filter.outputs.workflow == 'true' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        }}

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # Critical fix for git reference errors
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deployment:
              - 'deployment/**'
            workflow:
              - '.github/workflows/deployment-tests.yml'
              - '.github/actions/**'

  deployment-tests:
    name: Deployment Tests (Shard ${{ matrix.shard-id }})
    needs: filter
    if: ${{ needs.filter.outputs.should-run == 'true' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard-id: [1, 2, 3, 4]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: deployment/go.sum

      - name: Setup Postgres
        uses: harmon758/postgresql-action@v1
        with:
          postgresql version: "16"
          postgresql db: chainlink_test
          postgresql user: postgres
          postgresql password: postgres

      - name: Download Dependencies
        run: go mod download
        working-directory: ./deployment

      - name: Run Deployment Tests (Shard ${{ matrix.shard-id }})
        working-directory: ./deployment
        env:
          CL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chainlink_test?sslmode=disable
          GO_TEST_SHARD_COUNT: 4
          GO_TEST_SHARD_INDEX: ${{ matrix.shard-id }}
        run: |
          go test -v ./... -timeout=25m

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-logs-shard-${{ matrix.shard-id }}
          path: |
            ./deployment/*.log
            ./deployment/*.xml
            ./deployment/output*
          retention-days: 7

  deployment-tests-result:
    name: Deployment Tests Result
    if: always()
    needs: [filter, deployment-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check Overall Result
        run: |
          if [[ "${{ needs.deployment-tests.result }}" == "success" ]]; then
            echo "All deployment test shards passed."
          else
            echo "Some deployment test shards failed or were cancelled."
            exit 1
          fi
