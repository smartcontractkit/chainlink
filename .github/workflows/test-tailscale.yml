name: Test RANE SOT Connectivity
run-name: Test internal service connectivity

on:
  push:

jobs:
  connect-sot:
    name: Test RANE SOT Connectivity
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID_RANE_SOT }}
          audience: ${{ secrets.TS_AUDIENCE_RANE_SOT }}
          tags: tag:chainlink-gha
      - name: Test Service Connectivity
        env:
          SERVICE_URL: "https://rane-sot-app-ingress-main-stage.tailec47a7.ts.net/v1/nodes?network=solana-mainnet"
        run: |
          for i in $(seq 1 50); do
            echo "Request $i/50"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -H "User-Agent: ingress-test" "${SERVICE_URL}"
            if [ "$i" -lt 50 ]; then
              sleep 1
            fi
          done
          echo "✅ Service is accessible via Tailscale"
