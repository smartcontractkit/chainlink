name: CI Core
run-name: CI Core

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CORE_TEST_SHARD_COUNT: "2"
  CORE_INTEGRATION_TEST_SHARD_COUNT: "2"
  CORE_DEPLOYMENT_TEST_SHARD_COUNT: "7"

# Run on key branches to make sure integration is good, otherwise run on all PR's
on:
  push:
    branches:
      - develop
      - "release/*"
  merge_group:
  pull_request:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

jobs:
  filter:
    name: Detect Changes
    permissions:
      pull-requests: read
    outputs:
      affected-modules: ${{ steps.changed-modules.outputs.modules-json }}
      # Runs on workflow changes, any deployment change, or any (non-ignored) core change
      should-run-deployment-tests: >-
        ${{
          steps.match-some.outputs.workflow == 'true' ||
          steps.match-some.outputs.deployment == 'true' ||
          steps.match-every.outputs.core-non-ignored == 'true' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        }}
      # Runs on workflow changes, and any (non-ignored) core changes
      should-run-core-tests: >-
        ${{
          steps.match-some.outputs.workflow == 'true' ||
          steps.match-every.outputs.core-non-ignored == 'true' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: smartcontractkit/chainlink
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: match-some
        with:
          # "if any changed file matches one or more of the conditions" (https://github.com/dorny/paths-filter/issues/225)
          predicate-quantifier: some
          # deployment - any changes in the deployment module
          # workflow - any changes that could affect this workflow definition
          #  - Assume any repository action changes affect this workflow
          filters: |
            deployment:
              - 'deployment/**'
            workflow:
              - '.github/workflows/ci-core.yml'
              - '.github/actions/**'
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: match-every
        with:
          # "if any changed file match all of the conditions" (https://github.com/dorny/paths-filter/issues/225)
          #   - Enables listing of files matching each filter.
          #   - Paths to files will be available in `${FILTER_NAME}_files` output variable.
          #   - Paths will be formatted as JSON array
          predicate-quantifier: every
          # core-non-ignored - all changes except for paths which do not affect core module
          #  - This is opt-in on purpose. To be safe, new files are assumed to have an affect on core unless listed here specifically.
          #  - For example: core module does not depend on deployment or integration-tests module.
          # all - changes in any directory
          #  - This is used resolve all affected modules based on changed files
          list-files: json
          filters: |
            core-non-ignored:
              - '**'
              - '!deployment/**'
              - '!integration-tests/**'
              - '!tools/secrets/**'
              - '!tools/docker/**'
              - '!tools/benchmark/**'
              - '!**/README.md'
              - '!**/CHANGELOG.md'
              - '!*.nix'
              - '!sonar-project.properties'
              - '!nix.conf'
              - '!nix-darwin-shell-hook.sh'
              - '!LICENSE'
              - '!.github/**'
              - '!core/scripts/cre/environment/examples/workflows/**'
            all:
              - '**'

      - name: Decide which tests to run (rollout-only)
        # To validate that this properly tests, we will run this beside the dorny/paths-filter actions
        # before using its output to actually gate any jobs.
        id: triggers
        uses: smartcontractkit/.github/actions/advanced-triggers@advanced-triggers/v1
        continue-on-error: true
        with:
          file-sets: |
            go-files:
              - "**/*.go"
              - "**/go.mod"
              - "**/go.sum"
            core-files:
              - "core/**"
            all-test-files:
              - "**/testdata/**"
              - "**/*_test.go"
            core-test-files:
              - "testdata/**"
              - "core/**/testdata/**"
              - "core/**/*_test.go"
            e2e-tests-files:
              - "system-tests/**"
              - "integration-tests/**"
            workflow-files:
              - ".github/workflows/ci-core.yml"
              - ".github/actions/**"
            deployment-files:
              - "deployment/**"
            ignored-files:
              - "core/scripts/cre/environment/examples/workflows/**"
          # Note:
          # - for pull_request, merge_group, and push events, a trigger will resolve to true if any changed files match the path/glob patterns
          #     - exclusion-sets/negations are applied first, and therefore filter all changed files before inclusion sets are applied
          # - by default these will resolve to true for schedule, and workflow_dispatch events
          triggers: |
            core-tests:
              exclusion-sets: [ e2e-tests-files, deployment-files, ignored-files ]
              inclusion-sets: [ go-files, core-files, all-test-files, workflow-files ]
              paths:
                - "tools/bin/go_core_tests"
            core-fuzz-tests:
              exclusion-sets: [ e2e-tests-files, deployment-files, ignored-files ]
              inclusion-sets: [ go-files, core-files, all-test-files, workflow-files ]
              paths:
                - "!**/testdata/**"
                - "**/fuzz/**"
                - "tools/bin/go_core_fuzz"
            core-race-tests:
              exclusion-sets: [ e2e-tests-files, deployment-files, ignored-files ]
              inclusion-sets: [ go-files, core-files, all-test-files, workflow-files ]
              paths:
                - "tools/bin/go_core_race_tests"
            core-integration-tests:
              exclusion-sets: [ e2e-tests-files, deployment-files, ignored-files ]
              inclusion-sets: [ go-files, core-files, all-test-files, workflow-files ]
              paths:
                - "tools/bin/go_core_tests_integration"
            deployment-tests:
              exclusion-sets: [ e2e-tests-files, core-test-files, ignored-files ]
              inclusion-sets: [ go-files, core-files, deployment-files, workflow-files ]
              paths:
                - "tools/bin/go_core_ccip_deployment_tests"

      - name: Changed modules
        id: changed-modules
        uses: smartcontractkit/.github/actions/changed-modules-go@changed-modules-go/v1
        with:
          # when scheduled/workflow_dispatch, run against all modules
          no-change-behaviour: all
          file-patterns: |
            **/*.go
            **/go.mod
            **/go.sum
          module-patterns: |
            **
            !core/scripts/cre/environment/examples/workflows/**

  shard-matrices:
    name: Build Shard Matrices
    needs: [ filter ]
    runs-on: ubuntu-latest
    outputs:
      core-test-matrix: ${{ steps.shard-matrices.outputs.core-test-matrix }}
    steps:
      - name: Build shard matrices
        id: shard-matrices
        shell: bash
        env:
          SHOULD_RUN_CORE_TESTS: ${{ needs.filter.outputs.should-run-core-tests }}
          SHOULD_RUN_DEPLOYMENT_TESTS: ${{ needs.filter.outputs.should-run-deployment-tests }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          run_id = os.environ["GITHUB_RUN_ID"]

          rows = []

          def add_core_tests_rows():
              count = int(os.environ["CORE_TEST_SHARD_COUNT"])
              should_run = os.environ["SHOULD_RUN_CORE_TESTS"]
              for i in range(count):
                  rows.append({
                      "aggregate-check": "core-tests",
                      "job-name": f"go_core_tests shard {i}/{count}",
                      "cmd": "go_core_tests",
                      "os": f"runs-on={run_id}-unit-{i}/cpu=48/ram=96/family=c6id+c5ad/spot=false/image=ubuntu24-full-x64/extras=s3-cache",
                      "should-run": should_run,
                      "trunk-auto-quarantine": "true",
                      "shard-count": str(count),
                      "shard-index": str(i),
                      "run-timeout-minutes": "15",
                      "touch-web-assets": "true",
                      "logs-artifact-name": f"go_core_tests_logs_shard_{i}",
                  })

          def add_core_integration_rows():
              count = int(os.environ["CORE_INTEGRATION_TEST_SHARD_COUNT"])
              should_run = os.environ["SHOULD_RUN_CORE_TESTS"]
              for i in range(count):
                  rows.append({
                      "aggregate-check": "core-tests-integration",
                      "job-name": f"go_core_tests_integration shard {i}/{count}",
                      "cmd": "go_core_tests_integration",
                      "os": f"runs-on={run_id}-integ-{i}/cpu=48/ram=96/family=c6i/spot=false/image=ubuntu24-full-x64/extras=s3-cache+tmpfs",
                      "should-run": should_run,
                      "trunk-auto-quarantine": "true",
                      "setup-solana": "true",
                      "install-loopps": "true",
                      "shard-count": str(count),
                      "shard-index": str(i),
                      "run-timeout-minutes": "15",
                      "touch-web-assets": "true",
                      "logs-artifact-name": f"go_core_tests_integration_logs_shard_{i}",
                  })

          def add_core_deployment_rows():
              count = int(os.environ["CORE_DEPLOYMENT_TEST_SHARD_COUNT"])
              should_run = os.environ["SHOULD_RUN_DEPLOYMENT_TESTS"]
              for i in range(count):
                  rows.append({
                      "aggregate-check": "core-deployment-tests",
                      "job-name": f"go_core_deployment_tests shard {i}/{count}",
                      "cmd": "go_core_deployment_tests",
                      "os": f"runs-on={run_id}-deployment-{i}/cpu=48/ram=96/family=c6id+c5ad/spot=false/image=ubuntu24-full-x64/extras=s3-cache",
                      "should-run": should_run,
                      "trunk-auto-quarantine": "true",
                      "go-mod-directory": "deployment/",
                      "setup-solana": "true",
                      "setup-aptos": "true",
                      "install-loopps": "true",
                      "setup-sui": "true",
                      "shard-count": str(count),
                      "shard-index": str(i),
                      "run-timeout-minutes": "20",
                      "logs-artifact-name": f"go_core_deployment_tests_logs_shard_{i}",
                  })

          def add_core_misc_rows():
              should_run = os.environ["SHOULD_RUN_CORE_TESTS"]
              rows.append({
                  "aggregate-check": "core-misc",
                  "job-name": "go_core_fuzz",
                  "cmd": "go_core_fuzz",
                  "os": f"runs-on={run_id}-fuzz/cpu=8/ram=32/family=m6id+m6idn/spot=false/image=ubuntu24-full-x64/extras=s3-cache",
                  "should-run": should_run,
                  "shard-count": "1",
                  "shard-index": "0",
                  "run-timeout-minutes": "15",
                  "touch-web-assets": "true",
                  "restore-build-cache-only": "true",
                  "increase-timeouts-on-schedule": "true",
                  "logs-artifact-name": "go_core_fuzz_logs",
              })
              rows.append({
                  "aggregate-check": "core-misc",
                  "job-name": "go_core_race_tests",
                  "cmd": "go_core_race_tests",
                  "os": f"runs-on={run_id}-race/cpu=64/ram=128/family=c7i/volume=80gb/spot=false/image=ubuntu24-full-x64/extras=s3-cache",
                  "should-run": should_run,
                  "shard-count": "1",
                  "shard-index": "0",
                  "run-timeout-minutes": "15",
                  "touch-web-assets": "true",
                  "restore-build-cache-only": "true",
                  "increase-timeouts-on-schedule": "true",
                  "print-races": "true",
                  "logs-artifact-name": "go_core_race_tests_logs",
              })

          add_core_tests_rows()
          add_core_integration_rows()
          add_core_deployment_rows()
          add_core_misc_rows()

          print(f"core-test-matrix={json.dumps(rows)}")
          PY

  golangci:
    name: GolangCI Lint
    needs: [ filter, run-frequency ]
    # We don't directly merge dependabot PRs to not waste the resources.
    if: ${{ needs.filter.outputs.affected-modules != '[]' && github.event_name !=
      'merge_group' && github.actor != 'dependabot[bot]' }}
    permissions:
      # To annotate code in the PR.
      checks: write
      contents: read
      # For golangci-lint-action's `only-new-issues` option.
      pull-requests: read
    runs-on: runs-on=${{ github.run_id }}-${{ strategy.job-index
      }}/cpu=16/ram=32/family=c6gd/spot=false/image=ubuntu24-full-arm64/extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        modules: ${{ fromJson(needs.filter.outputs.affected-modules) }}
    steps:
      - name: Enable S3 Cache for Self-Hosted Runners
        uses: runs-on/action@742bf56072eb4845a0f94b3394673e4903c90ff0 # v2.1.0
        with:
          metrics: cpu,network,memory,disk

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Golang Lint (${{ matrix.modules }})
        id: golang-lint
        uses: ./.github/actions/golangci-lint
        timeout-minutes: 20
        with:
          go-directory: ${{ matrix.modules }}

      - name: Notify Slack
        # Skip for now as it's always failing on scheduled runs
        if: false
        # if: ${{ failure() && needs.run-frequency.outputs.one-per-day-frequency == 'true' }}
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.QA_SLACK_API_KEY }}
          payload: |
            channel: ${{ secrets.SLACK_TEAM_CORE_CHANNEL_ID}}
            text: "golangci-lint failed (${{ matrix.modules }}): <${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}|Run> - <${{ steps.golang-lint.outputs.golang-report-artifact-url }}|Report>"

  # Fails if any golangci-lint matrix jobs fails and silently succeeds otherwise
  # Consolidates golangci-lint matrix job results under one required `lint` check
  # Inclusive check: all (new) modules are analyzed, but no need to enable "required" checks for each one
  golangci-matrix-results-validation:
    name: lint
    if: ${{ always() }}
    needs: [ filter, golangci ]
    runs-on: ubuntu-latest
    steps:
      - name: Check Golangci-lint Matrix Results
        env:
          GOLANGCI_RESULT: ${{ needs.golangci.result }}
          ALLOW_FAILURE: ${{ contains(join(github.event.pull_request.labels.*.name, ' '),
            'allow-lint-issues') }}
          SKIPPED: ${{ needs.filter.outputs.affected-modules == '[]' }}
        run: |
          if [[ "${GOLANGCI_RESULT}" == "success" ]]; then
            echo "All 'GolangCI Lint' matrix jobs succeeded."
            exit 0
          fi

          if [[ "${GOLANGCI_RESULT}" == "skipped" || "${SKIPPED}" == "true" ]]; then
            echo "'GolangCI Lint' jobs were skipped."
            exit 0
          fi

          if [[ "${ALLOW_FAILURE}" == "true" ]]; then
            echo "Some 'GolangCI Lint' matrix jobs failed, but failures are allowed due to 'allow-lint-issues' label."
            exit 0
          fi

          if [[ "${GOLANGCI_RESULT}" == "cancelled" ]]; then
            echo "'GolangCI Lint' jobs were cancelled."
            exit 1
          fi

          if [[ "${GOLANGCI_RESULT}" == "failure" ]]; then
            echo "'GolangCI Lint' matrix jobs had failures."
            exit 1
          fi

  core-shard-consistency:
    name: Check Core Test Sharding Consistency
    needs: [ filter ]
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          go-module-file: go.sum

      - name: Download Go vendor packages
        run: go mod download

      - name: Download deployment Go vendor packages
        run: cd deployment && go mod download

      - name: Verify core test sharding
        shell: bash
        run: |
          go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... \
            | go run ./tools/ci-testshard verify --shard-count "${CORE_TEST_SHARD_COUNT}"

      - name: Verify integration test sharding
        shell: bash
        run: |
          integration_tagged_test_files=$(find . -name '*_test.go' -exec grep -l '//go:build integration' {} +)
          if [[ -z "$integration_tagged_test_files" ]]; then
            echo "No integration-tagged tests found."
            exit 0
          fi
          echo "$integration_tagged_test_files" | xargs -n1 dirname | sort -u \
            | go run ./tools/ci-testshard verify --shard-count "${CORE_INTEGRATION_TEST_SHARD_COUNT}"

      - name: Verify deployment test sharding
        shell: bash
        run: |
          (
            cd deployment || exit 1
            go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...
          ) | go run ./tools/ci-testshard verify --shard-count "${CORE_DEPLOYMENT_TEST_SHARD_COUNT}"

  core-tests:
    env:
      # We explicitly have this env var not be "CL_DATABASE_URL" to avoid having it be used by core related tests
      # when they should not be using it, while still allowing us to DRY up the setup
      DB_URL: postgresql://postgres:postgres@localhost:5432/chainlink_test?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.shard-matrices.outputs.core-test-matrix) }}
    name: Core Tests (${{ matrix.job-name }})
    if: ${{ github.actor != 'dependabot[bot]' }}
    needs: [ filter, shard-matrices, run-frequency ]
    timeout-minutes: 30
    runs-on: ${{ matrix.should-run == 'true' && matrix.os || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Enable S3 Cache for Self-Hosted Runners
        uses: runs-on/action@742bf56072eb4845a0f94b3394673e4903c90ff0 # v2.1.0
        with:
          metrics: cpu,network,memory,disk
      - name: Checkout the repo
        if: ${{ matrix.should-run == 'true' }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Go
        if: ${{ matrix.should-run == 'true' }}
        uses: ./.github/actions/setup-go
        with:
          restore-build-cache-only: ${{ matrix.restore-build-cache-only == 'true' }}
          build-cache-version: ${{ matrix.cmd }}
          go-version-file: ${{ matrix.go-mod-directory }}go.mod
          go-module-file: ${{ matrix.go-mod-directory }}go.sum
      - name: Setup Solana
        if: ${{ matrix.should-run == 'true' && matrix.setup-solana == 'true' }}
        uses: ./.github/actions/setup-solana
      - name: Setup Aptos
        if: ${{ matrix.should-run == 'true' && matrix.setup-aptos == 'true' }}
        uses: aptos-labs/actions/install-aptos-cli@63740b290d839b87ecfafbcf75ed03a36a54a29f # jan 15, 2025
        with:
          CLI_VERSION: 8.1.0
      - name: Setup Sui CLI v1.69.2
        if: ${{ matrix.should-run == 'true' && matrix.setup-sui == 'true' }}
        uses: ./.github/actions/setup-sui
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: mainnet-v1.69.2
      - name: Setup wasmd
        if: ${{ matrix.should-run == 'true' }}
        uses: ./.github/actions/setup-wasmd
      - name: Setup Postgres
        if: ${{ matrix.should-run == 'true' }}
        uses: smartcontractkit/.github/actions/setup-postgres@setup-postgres/v1
        with:
          tmpfs: "true"
          image-tag: "16-alpine"
      - name: Touching core/web/assets/index.html
        if: ${{ matrix.should-run == 'true' && matrix.touch-web-assets == 'true' }}
        run: mkdir -p core/web/assets && touch core/web/assets/index.html
      - name: Download Go vendor packages
        if: ${{ matrix.should-run == 'true' }}
        run: go mod download
      - name: Setup DB
        if: ${{ matrix.should-run == 'true' }}
        run: go run ./core/store/cmd/preparetest
        env:
          CL_DATABASE_URL: ${{ env.DB_URL }}
      - name: Install LOOP Plugins
        if: ${{ matrix.should-run == 'true' && matrix.install-loopps == 'true' }}
        run: make install-plugins
      - name: Increase Timeouts for Fuzz/Race
        if: ${{ matrix.should-run == 'true' && matrix.increase-timeouts-on-schedule ==
          'true' && github.event.schedule != '' }}
        run: |
          echo "TIMEOUT=10m" >> $GITHUB_ENV
          echo "COUNT=50" >> $GITHUB_ENV
          echo "FUZZ_TIMEOUT_MINUTES=10" >> $GITHUB_ENV
      - name: Run tests
        if: ${{ matrix.should-run == 'true' }}
        timeout-minutes: ${{ fromJson(matrix.run-timeout-minutes) }}
        continue-on-error: ${{ matrix.trunk-auto-quarantine == 'true' }}
        id: run-tests
        shell: bash
        env:
          CL_DATABASE_URL: ${{ env.DB_URL }}
          OUTPUT_FILE: ./output.txt
          PRODUCE_JUNIT_XML: ${{ matrix.trunk-auto-quarantine }}
          TRUNK_AUTO_QUARANTINE: ${{ matrix.trunk-auto-quarantine }}
          RUN_QUARANTINED_TESTS: "true"
          JUNIT_FILE: ${{ github.workspace }}/junit.xml
          GO_TEST_SHARD_COUNT: ${{ matrix.shard-count }}
          GO_TEST_SHARD_INDEX: ${{ matrix.shard-index }}
        run: |
          GODEBUG=goindex=0 ./tools/bin/${{ matrix.cmd }} ./...
          # See: https://github.com/golang/go/issues/69179
      - name: Print Races
        id: print-races
        if: ${{ failure() && matrix.print-races == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find race.* | xargs cat >> races.txt
          if [[ -s races.txt ]]; then
            cat races.txt
            echo "post_to_slack=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "post_to_slack=false" | tee -a "$GITHUB_OUTPUT"
          fi
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.ref: ${{ github.ref }}"
      - name: Write row status
        if: ${{ always() }}
        shell: bash
        env:
          AGGREGATE_CHECK: ${{ matrix.aggregate-check }}
          SHOULD_RUN: ${{ matrix.should-run }}
          RUN_TESTS_OUTCOME: ${{ steps.run-tests.outcome }}
          JOB_STATUS: ${{ job.status }}
          LOGS_ARTIFACT_NAME: ${{ matrix.logs-artifact-name }}
        run: |
          if [[ "${SHOULD_RUN}" != "true" ]]; then
            result="skipped"
          elif [[ "${RUN_TESTS_OUTCOME}" == "failure" ]]; then
            result="failure"
          elif [[ "${JOB_STATUS}" == "failure" ]]; then
            result="failure"
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            result="cancelled"
          else
            result="success"
          fi

          cat > "${LOGS_ARTIFACT_NAME}-status.json" <<EOF
          {"aggregate_check":"${AGGREGATE_CHECK}","result":"${result}"}
          EOF
      - name: Analyze and upload test results
        if: ${{ matrix.should-run == 'true' && matrix.trunk-auto-quarantine == 'true' &&
          !cancelled() }}
        uses: smartcontractkit/.github/actions/branch-out-upload@branch-out-upload/v1
        with:
          junit-file-path: "./junit.xml"
          trunk-org-slug: chainlink
          trunk-token: ${{ secrets.TRUNK_API_KEY }}
          trunk-previous-step-outcome: ${{ steps.run-tests.outcome }}
          trunk-upload-only: ${{ matrix.trunk-auto-quarantine != 'true' }}
          artifact-name: ${{ matrix.logs-artifact-name }}
      - name: Print postgres logs
        if: ${{ always() }}
        uses: smartcontractkit/.github/actions/setup-postgres@setup-postgres/v1
        with:
          print-logs: "true"
      - name: Upload row status
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: row-status-${{ matrix.logs-artifact-name }}
          path: ${{ matrix.logs-artifact-name }}-status.json
          retention-days: 7
      - name: Store logs artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.logs-artifact-name }}
          path: |
            ./output.txt
            ./output-short.txt
            ./race.*
            ./coverage.txt
            ./postgres_logs.txt
            ./junit.xml
            ./deployment/junit.xml
          retention-days: 7
      - name: Notify Slack on Race Test Failure
        if: |
          failure() &&
          matrix.print-races == 'true' &&
          steps.print-races.outputs.post_to_slack == 'true'  &&
          (github.event_name == 'merge_group' || github.ref == 'refs/heads/develop')
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.QA_SLACK_API_KEY }}
          payload: |
            channel: ${{ secrets.SLACK_TOPIC_DATA_RACES_CHANNEL_ID}}
            text: "Race Tests Failed: <${{ format('https://github.com/{0}/actions/runs/{1}/job/{2}', github.repository, github.run_id, job.check_run_id) }}|Run>"

  core-tests-integration-result:
    name: Core Tests (go_core_tests_integration)
    if: ${{ always() && github.actor != 'dependabot[bot]' }}
    needs: [ core-tests, core-shard-consistency ]
    runs-on: ubuntu-latest
    steps:
      - name: Download row status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: row-status-*
          merge-multiple: true
      - name: Check integration shard results
        env:
          AGGREGATE_CHECK: core-tests-integration
          EXPECTED_ROWS: ${{ env.CORE_INTEGRATION_TEST_SHARD_COUNT }}
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import sys

          suite = os.environ["AGGREGATE_CHECK"]
          expected = int(os.environ["EXPECTED_ROWS"])
          rows = []
          for path in glob.glob("*-status.json"):
              with open(path, encoding="utf-8") as f:
                  row = json.load(f)
              if row.get("aggregate_check") == suite:
                  rows.append(row)

          if len(rows) != expected:
              print(f"Expected {expected} rows for {suite}, got {len(rows)}")
              sys.exit(1)

          results = [row["result"] for row in rows]
          if all(result == "skipped" for result in results):
              print("Integration core tests were skipped.")
              sys.exit(0)
          if any(result in {"failure", "cancelled"} for result in results):
              print(f"Integration shard group failed with results: {results}")
              sys.exit(1)
          print("All integration shards succeeded.")
          PY

