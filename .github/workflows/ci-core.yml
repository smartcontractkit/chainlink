name: CI-Core with AWS Deployment

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deployment-changed: ${{ steps.match-some.outputs.deployment }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Ensure develop branch is fetched
        run: git fetch origin develop:origin/develop || echo "develop already up-to-date"

      - name: Detect Changed Paths (match-some)
        id: match-some
        uses: dorny/paths-filter@v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          base: origin/develop
          filters: |
            deployment:
              - 'deployment/**'
            workflow:
              - '.github/workflows/ci-core.yml'
              - '.github/actions/**'

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.deployment-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== AWS Configuration =====
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # replace with your region

      # Optional: debug AWS connection
      - name: Debug AWS CLI
        run: aws sts get-caller-identity

      # ===== Deployment Steps =====
      - name: Run Deployment Scripts
        run: |
          echo "Running deployment..."
          # Example: deploy to S3
          aws s3 sync deployment/ s3://your-bucket-name --delete
