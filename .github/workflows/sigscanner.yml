name: 'SigScanner Check'

on:
  merge_group:
  push:

jobs:
  sigscanner-check:
    runs-on: ubuntu-latest
    steps:
      - name: "🔎 SigScanner checking ${{ github.sha }} by ${{ github.actor }}"
        env:
          API_TOKEN: ${{ secrets.SIGSCANNER_API_TOKEN }}
          API_URL: ${{ secrets.SIGSCANNER_API_URL }}
        run: |
          echo "🔁 Sending verification request..."
          CODE=$(curl --write-out '%{http_code}' \
                      --silent \
                      --output /dev/null \
                      --request POST \
                      --header "Content-Type: application/json" \
                      --header "Authorization: $API_TOKEN" \
                      --url "$API_URL" \
                      --data "{\"commit\":\"${GITHUB_SHA}\",\"repository\":\"${GITHUB_REPOSITORY}\",\"author\":\"${GITHUB_ACTOR}\"}")
          
          echo "📡 Received response code: $CODE"

          if [[ "$CODE" == "200" ]]; then
            echo "✅ Commit verified by SigScanner"
            exit 0
          else
            echo "❌ Commit NOT verified. Code: $CODE"
            exit 1
          fi
