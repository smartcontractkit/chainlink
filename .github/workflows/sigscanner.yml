name: "SigScanner Check"

on:
  pull_request:
  merge_group:
  push:
    branches:
      - develop
      - release/*

permissions: {}

env:
  # Bot logins mapped to their SSH signing-key fingerprints. Commits signed
  # by a known bot key are exempt from SigScanner. Stored here (not in
  # Secrets) so that any change requires code-review approval.
  # These bots sign via GitHub App SSH keys that are not linked to accounts,
  # so GitHub reports verified=false/unknown_key — we must extract the
  # public key from the SSH signature and compute its fingerprint ourselves.
  # To add a new bot, append a "login": "fingerprint" entry to BOT_KEYS.
  BOT_KEYS: >-
    {
      "chainlink-release-pusher[bot]": "SHA256:ZbmANK1Txn2p21TXLqLn9OdfsgPNW9Nt1s9s1i0/1bc"
    }

jobs:
  sigscanner-check:
    # Skip merge_group events — github.actor there is whoever enqueued
    # the merge, not the PR author, so we can't reliably attribute commits.
    # Especially since it's expected that we squash merge for this repo.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # On pull_request, github.sha is a temporary merge commit; use the
      # actual PR head commit so we verify the author's signed commit.
      # On push, github.sha is the real commit on develop.
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check if commit is signed by a known bot
        id: bot-sig-check
        # On pull_request events, check whether the PR author is a known
        # bot. github.event.pull_request.user.login is set server-side
        # by GitHub and cannot be spoofed. On push events (no PR context)
        # this condition is false, so we skip straight to SigScanner.
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const crypto = require('crypto');

            const botKeys = JSON.parse(process.env.BOT_KEYS);
            const prAuthor = context.payload.pull_request.user.login;
            const expectedFP = botKeys[prAuthor];

            if (!expectedFP) {
              core.info(`PR author ${prAuthor} is not a known bot — SigScanner will run`);
              return;
            }

            const commitSHA = process.env.COMMIT_SHA;
            core.info(`🔑 PR opened by known bot ${prAuthor} — verifying commit signature …`);
            core.info(`Expected bot key fingerprint: ${expectedFP}`);

            // The bot signs commits with an SSH key from a GitHub App that is not
            // linked to a GitHub account, so the API reports verified=false with
            // reason=unknown_key. We cannot rely on verification status. Instead,
            // extract the public key embedded in the SSH signature and compute its
            // SHA256 fingerprint to compare against the known bot key fingerprint.
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: commitSHA,
            });

            const sig = commit.commit.verification?.signature;
            if (!sig) {
              core.setFailed('PR is from a known bot but the commit has no signature');
              return;
            }

            // Parse the SSH signature to extract the embedded public key and
            // compute its SHA256 fingerprint.
            // SSH signature binary format:
            //   'SSHSIG' magic (6 bytes) + uint32 version (4 bytes) +
            //   string publickey (uint32 length + key blob) + ...
            const sigB64 = sig.split('\n').filter(l => !l.startsWith('-----')).join('');
            const buf = Buffer.from(sigB64, 'base64');
            const pkLen = buf.readUInt32BE(10);
            const pkBlob = buf.subarray(14, 14 + pkLen);
            const fp = 'SHA256:' + crypto.createHash('sha256')
              .update(pkBlob).digest('base64').replace(/=+$/, '');

            core.info(`Commit signature fingerprint: ${fp}`);

            if (fp === expectedFP) {
              core.info(`✅ Commit is signed by known bot ${prAuthor} — skipping SigScanner`);
              core.setOutput('signed_by_bot', 'true');
            } else {
              core.setFailed(`PR is from bot ${prAuthor} but commit is signed by unknown key (${fp})`);
            }

      - name: "SigScanner checking ${{ env.COMMIT_SHA }} by ${{ github.actor }}"
        if: steps.bot-sig-check.outputs.signed_by_bot != 'true'
        env:
          API_TOKEN: ${{ secrets.SIGSCANNER_API_TOKEN }}
          API_URL: ${{ secrets.SIGSCANNER_API_URL }}
        run: |
          echo "🔎 Checking commit ${COMMIT_SHA} by ${GITHUB_ACTOR} in ${GITHUB_REPOSITORY} - ${GITHUB_EVENT_NAME}"
          CODE=$(curl \
            --write-out '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: $API_TOKEN" \
            --silent \
            --output /dev/null \
            --url "$API_URL" \
            --data "{\"commit\":\"${COMMIT_SHA}\",\"repository\":\"${GITHUB_REPOSITORY}\",\"author\":\"${GITHUB_ACTOR}\"}"
          )
          echo "Received $CODE"
          if [[ "$CODE" == "200" ]]; then
            echo "✅ Commit is verified"
            exit 0
          else
            echo "❌ Commit is NOT verified"
            exit 1
          fi
