name: CRE Node Upgrade Tests

on:
  workflow_dispatch:
    inputs:
      chainlink_version:
        required: true
        type: string
        description: "Git ref to checkout for tests."
        default: "develop"
      base_chainlink_image_tag:
        required: true
        type: string
        description: "Base Chainlink image tag. Full image is public.ecr.aws/chainlink/chainlink:<tag>."
      upgrade_chainlink_image_tag:
        required: true
        type: string
        description: "Upgrade Chainlink image tag. Full image is public.ecr.aws/chainlink/chainlink:<tag>."
  workflow_call:
    inputs:
      chainlink_version:
        required: true
        type: string
      base_chainlink_image_tag:
        required: true
        type: string
      upgrade_chainlink_image_tag:
        required: true
        type: string
  pull_request:

jobs:
  run-upgrade-tests:
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - Test_CRE_V2_Upgrade_DONTime
          - Test_CRE_V2_Upgrade_Consensus
          - Test_CRE_V2_Upgrade_HTTPTriggerAction
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.test_name }}-${{ github.run_attempt }}/cpu=16/ram=64/family=m6i+m5.*/spot=false/image=ubuntu24-full-x64/extras=s3-cache+tmpfs
    timeout-minutes: 60
    environment: "integration"
    permissions:
      contents: read
      id-token: write
    env:
      TOPOLOGY_NAME: workflow-gateway
      CTF_CONFIGS: configs/2.32.0-cre-beta.5/workflow-gateway-don.toml
      TEST_TIMEOUT: 35m
      CHAINLINK_IMAGE_REPOSITORY: public.ecr.aws/chainlink/chainlink
      BASE_CHAINLINK_IMAGE_TAG: ${{ inputs.base_chainlink_image_tag || '2.32.0-cre-beta.5' }}
      UPGRADE_CHAINLINK_IMAGE_TAG: ${{ inputs.upgrade_chainlink_image_tag || '2.32.0-cre-beta.7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.chainlink_version || github.sha }}
          persist-credentials: false

      - name: Enable S3 Cache for Self-Hosted Runners
        # these env vars are set (and exposed) when it is a self-hosted runner with extras=s3-cache
        if: ${{ env.RUNS_ON_INSTANCE_ID != '' && env.ACTIONS_CACHE_URL != '' }}
        uses: runs-on/action@66d4449b717b5462159659523d1241051ff470b9 # v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: system-tests/tests/go.mod
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          aws-region: ${{ secrets.QA_AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_CTF_READ_ACCESS_ROLE_ARN }}
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ format('{0},{1}', secrets.QA_AWS_ACCOUNT_NUMBER, secrets.AWS_ACCOUNT_ID_PROD) }}
        env:
          AWS_REGION: ${{ secrets.QA_AWS_REGION }}

      - name: Start local CRE
        shell: bash
        env:
          CTF_CHAINLINK_IMAGE: ${{ env.CHAINLINK_IMAGE_REPOSITORY }}:${{ env.BASE_CHAINLINK_IMAGE_TAG }}
          CTF_JD_IMAGE: "${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/job-distributor:0.22.1"
        run: |
          cd core/scripts/cre/environment
          go run . env start --with-plugins-docker-image "${CTF_CHAINLINK_IMAGE}" --cleanup-on-error=false

      - name: Run one upgrade smoke scenario
        shell: bash
        working-directory: system-tests/tests
        env:
          TEST_NAME: ${{ matrix.test_name }}
          CTF_CHAINLINK_UPGRADE_IMAGE: ${{ env.CHAINLINK_IMAGE_REPOSITORY }}:${{ env.UPGRADE_CHAINLINK_IMAGE_TAG }}
          CTF_UPGRADE_COPY_CAPABILITY_BINARIES: "false"
          CHIP_INGRESS_IMAGE: ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/atlas-chip-ingress:da84cb72d3a160e02896247d46ab4b9806ebee2f
          CHIP_CONFIG_IMAGE: ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/atlas-chip-config:7b4e9ee68fd1c737dd3480b5a3ced0188f29b969
        run: |
          go test github.com/smartcontractkit/chainlink/system-tests/tests/smoke/cre \
            -tags upgrade \
            -v \
            -run "^(${TEST_NAME})$" \
            -timeout "${TEST_TIMEOUT}" \
            -count=1 \
            -parallel=1
