name: SonarQube Scan

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["CI Core"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Commit SHA to analyze and stamp"
        required: false
        type: string
      pr_number:
        description: "Pull Request number (if applicable)"
        required: false
        type: string
      head_branch:
        description: "Head branch name"
        required: false
        type: string
      base_branch:
        description: "Base branch name"
        required: false
        type: string

jobs:
  scan:
    name: SonarQube Scan
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.actor.login != 'dependabot[bot]' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # fetches all history for all tags and branches to provide more metadata for sonar reports
          ref: ${{ github.event.workflow_run.head_sha || inputs.head_sha || github.sha }}

      - name: Download artifacts from parent workflow
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.event_name == 'workflow_run' }}

      - name: Check and Set SonarQube Report Paths
        id: report-paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.head_branch || github.ref_name }}
          BASE_BRANCH: ${{ github.event.workflow_run.pull_requests[0].base.ref || inputs.base_branch || 'develop' }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          WORKFLOW_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Evaluating SonarQube scan for HEAD_SHA=${HEAD_SHA}, HEAD_BRANCH=${HEAD_BRANCH}, BASE_BRANCH=${BASE_BRANCH}, CONCLUSION=${CONCLUSION}"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"

          # Release branch or Tag Push check: skip scan but post success status
          if [[ "${HEAD_BRANCH}" =~ ^release/ ]] || [[ "${BASE_BRANCH}" =~ ^release/ ]] || [[ "${HEAD_BRANCH}" =~ ^v[0-9] ]] || [[ "${github.ref}" =~ ^refs/tags/ ]]; then
            echo "Release branch or tag push detected (${HEAD_BRANCH} -> ${BASE_BRANCH}). Skipping SonarQube scan."
            gh api "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --method POST \
              -f state=success \
              -f context="SonarQube Scan" \
              -f description="SonarQube scan skipped on release branch/tag" \
              -f target_url="${WORKFLOW_URL}" || true
            echo "skip-scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CI Core failure/cancellation check
          if [[ "${github.event_name}" == "workflow_run" ]]; then
            if [[ "${CONCLUSION}" == "failure" ]]; then
              echo "CI Core workflow failed. Marking SonarQube Scan as failure."
              gh api "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                --method POST \
                -f state=failure \
                -f context="SonarQube Scan" \
                -f description="CI Core failed, SonarQube scan skipped" \
                -f target_url="${WORKFLOW_URL}" || true
              echo "skip-scan=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ "${CONCLUSION}" == "cancelled" ]]; then
              echo "CI Core workflow was cancelled. Marking SonarQube Scan as cancelled."
              gh api "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                --method POST \
                -f state=error \
                -f context="SonarQube Scan" \
                -f description="CI Core was cancelled" \
                -f target_url="${WORKFLOW_URL}" || true
              echo "skip-scan=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Check and assign paths for coverage/test reports in go_core_tests_logs
          core_artifact="go_core_tests_logs"
          if [ -d "$core_artifact" ]; then
            echo "Found $core_artifact"
            sonarqube_coverage_report_paths=$(find "./${core_artifact}" -name coverage.txt | paste -sd "," -)
            sonarqube_tests_report_paths=$(find "./${core_artifact}" -name output.txt | paste -sd "," -)
            echo "Coverage report paths: $sonarqube_coverage_report_paths"
            echo "Tests report paths: $sonarqube_tests_report_paths"
          else
            echo "Did not find $core_artifact"
            sonarqube_coverage_report_paths=""
            sonarqube_tests_report_paths=""
          fi

          # Check and assign paths for coverage/test reports in go_core_tests_integration_logs
          integration_tests_artifact="go_core_tests_integration_logs"
          if [ -d "$integration_tests_artifact" ]; then
            echo "Found $integration_tests_artifact"
            integration_coverage_paths=$(find "./${integration_tests_artifact}" -name coverage.txt | paste -sd "," -)
            integration_tests_paths=$(find "./${integration_tests_artifact}" -name output.txt | paste -sd "," -)

            sonarqube_coverage_report_paths="${sonarqube_coverage_report_paths:+$sonarqube_coverage_report_paths,}$integration_coverage_paths"
            sonarqube_tests_report_paths="${sonarqube_tests_report_paths:+$sonarqube_tests_report_paths,}$integration_tests_paths"
          fi

          # Check and assign paths for coverage/test reports in go_core_scripts_tests_logs
          scripts_tests_artifact="go_core_scripts_tests_logs"
          if [ -d "$scripts_tests_artifact" ]; then
              echo "Found $scripts_tests_artifact"
              scripts_coverage_paths=$(find "./${scripts_tests_artifact}" -name coverage.txt | paste -sd "," -)
              scripts_tests_paths=$(find "./${scripts_tests_artifact}" -name output.txt | paste -sd "," -)

              sonarqube_coverage_report_paths="${sonarqube_coverage_report_paths:+$sonarqube_coverage_report_paths,}$scripts_coverage_paths"
              sonarqube_tests_report_paths="${sonarqube_tests_report_paths:+$sonarqube_tests_report_paths,}$scripts_tests_paths"
          fi

          # Check and assign paths for lint reports
          sonarqube_lint_report_paths=""
          shopt -s nullglob
          for golang_lint_artifact in golangci-lint-report*
          do
              [[ -d "$golang_lint_artifact" ]] || continue
              echo "Found golangci-lint-report artifact: $golang_lint_artifact"
              part=$(find "$golang_lint_artifact" -type f -name 'golangci-lint-report.xml' -printf '%p,')
              sonarqube_lint_report_paths+="$part"
          done
          shopt -u nullglob
          echo "Lint report paths: $sonarqube_lint_report_paths"

          # Sonar overwrites a branch's measures with whatever an analysis reports, so
          # publishing with no reports at all would zero out coverage. Skip instead.
          if [[ -z "${sonarqube_tests_report_paths}${sonarqube_coverage_report_paths}${sonarqube_lint_report_paths}" ]]; then
            echo "::warning::No test, coverage, or lint reports found, skipping SonarQube analysis"
            gh api "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --method POST \
              -f state=success \
              -f context="SonarQube Scan" \
              -f description="No reports found to scan" \
              -f target_url="${WORKFLOW_URL}" || true
            echo "skip-scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARGS=""
          if [[ -n "${PR_NUMBER}" ]]; then
            ARGS="$ARGS -Dsonar.pullrequest.key=${PR_NUMBER}"
            ARGS="$ARGS -Dsonar.pullrequest.branch=${HEAD_BRANCH}"
            ARGS="$ARGS -Dsonar.pullrequest.base=${BASE_BRANCH}"
          elif [[ "${HEAD_BRANCH}" == "develop" ]]; then
            ARGS="$ARGS -Dsonar.branch.name=${HEAD_BRANCH}"
          else
            echo "::warning::No PR context for '${HEAD_BRANCH}', skipping SonarQube analysis"
            gh api "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --method POST \
              -f state=success \
              -f context="SonarQube Scan" \
              -f description="No PR context for non-develop branch, skipped" \
              -f target_url="${WORKFLOW_URL}" || true
            echo "skip-scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$sonarqube_tests_report_paths" ]]; then
            echo "::warning::No test report paths found, will not pass to sonarqube"
          else
            echo "Found test report paths: $sonarqube_tests_report_paths"
            ARGS="$ARGS -Dsonar.go.tests.reportPaths=$sonarqube_tests_report_paths"
          fi

          if [[ -z "$sonarqube_coverage_report_paths" ]]; then
            echo "::warning::No coverage report paths found, will not pass to sonarqube"
          else
            echo "Found coverage report paths: $sonarqube_coverage_report_paths"
            ARGS="$ARGS -Dsonar.go.coverage.reportPaths=$sonarqube_coverage_report_paths"
          fi

          if [[ -z "$sonarqube_lint_report_paths" ]]; then
            echo "::warning::No lint report paths found, will not pass to sonarqube"
          else
            echo "Found lint report paths: $sonarqube_lint_report_paths"
            ARGS="$ARGS -Dsonar.go.golangci-lint.reportPaths=$sonarqube_lint_report_paths"
          fi

          echo "Final SONARQUBE_ARGS: $ARGS"
          echo "SONARQUBE_ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "skip-scan=false" >> "$GITHUB_OUTPUT"

          # Update status to pending while Sonar scanner is running
          gh api "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            -f state=pending \
            -f context="SonarQube Scan" \
            -f description="SonarQube scan in progress..." \
            -f target_url="${WORKFLOW_URL}" || true

      - name: SonarQube Scan
        id: sonar-scan
        if: ${{ steps.report-paths.outputs.skip-scan == 'false' }}
        uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: ${{ env.SONARQUBE_ARGS }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_SCANNER_OPTS: "-Xms6g -Xmx8g"

      - name: Update Commit Status
        if: ${{ always() && steps.report-paths.outputs.skip-scan == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          SCAN_OUTCOME: ${{ steps.sonar-scan.outcome }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCAN_OUTCOME" == "success" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --method POST \
              -f state=success \
              -f context="SonarQube Scan" \
              -f description="SonarQube scan passed" \
              -f target_url="${WORKFLOW_URL}" || true
          else
            gh api "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --method POST \
              -f state=failure \
              -f context="SonarQube Scan" \
              -f description="SonarQube scan failed" \
              -f target_url="${WORKFLOW_URL}" || true
          fi
