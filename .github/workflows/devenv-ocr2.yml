name: OCR2 Load Test

on:
  pull_request:

defaults:
  run:
    working-directory: devenv

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    runs-on: ubuntu24.04-16cores-64GB
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
        with:
          just-version: '1.40.0'

      # TODO: we don't really need it if we can reference private image with a mutable tag here
      # - name: Authenticate to AWS ECR
      #   uses: ./.github/actions/aws-ecr-auth
      #   with:
      #     role-to-assume: ${{ secrets.CL_DEVENV_IAM_ROLE }}
      #     aws-region: us-east-1
      #     registry-type: public

      - name: Set up Go
        uses: actions/setup-go@v6 # v6
        with:
          cache: true
          go-version-file: devenv/go.mod
          cache-dependency-path: devenv/go.sum

      - name: Download Go dependencies
        run: |
          go mod download

      - name: Run OCR2 environment
        run: |
          cd cmd/cl && go install . && cd -
          cl u env.toml && cl obs up

      - name: Run Soak tests
        id: soak_test
        working-directory: devenv/tests/e2e
        run: go test -v -timeout 20m -run TestLoad

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs-smoke
          path: devenv/tests/e2e/logs
          retention-days: 1
