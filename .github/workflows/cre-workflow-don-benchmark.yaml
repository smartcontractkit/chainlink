name: CRE Workflow DON Benchmark

on:
  workflow_dispatch:
    inputs:
      chainlink_image_tag:
        required: true
        type: string
        description: "The tag of the Chainlink image to use for the tests."
      chainlink_version:
        required: true
        type: string
        description: "The version of Chainlink repository to use for the tests."
        default: "develop"
  workflow_call:
    inputs:
      chainlink_image_tag:
        required: true
        type: string
        description: "The tag of the Chainlink image to use for the tests."
      chainlink_version:
        required: true
        type: string
        description: "The version of Chainlink repository to use for the tests."
        default: "develop"
  pull_request:
    types: [labeled, synchronize]

jobs:
  workflow-don-benchmark:
    runs-on: ubuntu-latest
    environment: "integration"
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-cre-workflow-don-benchmark'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || inputs.chainlink_version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/scripts/go.mod

      # We need to login to ECR to allow the test to pull the Job Distributor and Chainlink images
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          aws-region: ${{ secrets.QA_AWS_REGION }}
          role-to-assume: ${{ secrets.QA_AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ format('{0},{1}', secrets.QA_AWS_ACCOUNT_NUMBER, secrets.AWS_ACCOUNT_ID_PROD) }}
        env:
          AWS_REGION: ${{ secrets.QA_AWS_REGION }}

      - name: Set date variable
        id: set-date
        if:  ${{ github.event_name == 'pull_request' }}
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Start streaming metrics per container
        shell: bash
        run: |
          mkdir -p system-tests/tests/load/cre/logs
          mkdir -p system-tests/tests/load/cre/logs/metrics
          mkdir -p system-tests/tests/load/cre/logs/metrics/container-stats
          for CID in $(docker ps -q); do
            echo "Starting stream for $CID → system-tests/tests/load/cre/logs/metrics/container-stats/${CID}.json"
            curl -s --unix-socket /var/run/docker.sock \
              "http://localhost/containers/$CID/stats?stream=1" \
              > system-tests/tests/load/cre/logs/metrics/container-stats/${CID}.json &
            echo $! > system-tests/tests/load/cre/logs/metrics/container-stats/${CID}.pid
          done

      - name: Start the test
        shell: bash
        env:
          E2E_JD_IMAGE: "${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/job-distributor"
          E2E_JD_VERSION: "0.9.0"
          E2E_TEST_CHAINLINK_IMAGE: "${{ secrets.QA_AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/chainlink"
          E2E_TEST_CHAINLINK_VERSION: ${{ github.event_name == 'pull_request' && format('nightly-{0}-plugins-testing', steps.set-date.outputs.date) || inputs.chainlink_image_tag }}
          # Anvil developer key, not a secret
          PRIVATE_KEY: "ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          CTF_CONFIGS: "workflow-don-benchmark-ci.toml"
          LOAD_TEST: "true"
          CI: "true"
          GH_SHA: ${{ github.sha }}
        run: |
          cd system-tests/tests/load/cre
          go test -run TestLoad_Workflow_Streams_MockCapabilities -timeout 15m

      - name: Debug directory structure
        if: always()
        shell: bash
        run: |
          echo "Current directory: $(pwd)"
          echo "Checking if directory exists:"
          ls -la system-tests/tests/load/cre/logs/metrics/ || echo "Metrics directory doesn't exist"
          echo "Looking for any PID files:"
          find . -name "*.pid" || echo "No PID files found anywhere"

      - name: Stop all streams and inspect files
        if: always()
        shell: bash
        run: |
          # stop background curls
          if [ -d "system-tests/tests/load/cre/logs/metrics/container-stats" ] && [ "$(find system-tests/tests/load/cre/logs/metrics/container-stats -name '*.pid' | wc -l)" -gt 0 ]; then
            for pidfile in system-tests/tests/load/cre/logs/metrics/container-stats/*.pid; do
              if [ -f "$pidfile" ]; then
                echo "Stopping stream process $(cat $pidfile)"
                kill "$(cat $pidfile)" 2>/dev/null || true
              fi
            done
          else
            echo "No stream PID files found in system-tests/tests/load/cre/logs/metrics/container-stats/"
          fi

      - name: Upload node logs and metrics as artifact
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: node logs
          path: |
            system-tests/tests/load/cre/logs
          retention-days: 1
