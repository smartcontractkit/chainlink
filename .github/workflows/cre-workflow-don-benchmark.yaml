name: CRE Workflow DON Benchmark

on:
  workflow_dispatch:
    inputs:
      chainlink_image_tag:
        required: true
        type: string
        description: "The tag of the Chainlink image to use for the tests."
      chainlink_version:
        required: true
        type: string
        description: "The version of Chainlink repository to use for the tests."
        default: "develop"
  workflow_call:
    inputs:
      chainlink_image_tag:
        required: true
        type: string
        description: "The tag of the Chainlink image to use for the tests."
      chainlink_version:
        required: true
        type: string
        description: "The version of Chainlink repository to use for the tests."
        default: "develop"
  pull_request:
    types: [labeled, synchronize]

jobs:
  workflow-don-benchmark:
    runs-on: ubuntu-latest
    environment: "integration"
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-cre-workflow-don-benchmark'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || inputs.chainlink_version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/scripts/go.mod

      # We need to login to ECR to allow the test to pull the Job Distributor and Chainlink images
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          aws-region: ${{ secrets.QA_AWS_REGION }}
          role-to-assume: ${{ secrets.QA_AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ format('{0},{1}', secrets.QA_AWS_ACCOUNT_NUMBER, secrets.AWS_ACCOUNT_ID_PROD) }}
        env:
          AWS_REGION: ${{ secrets.QA_AWS_REGION }}

      - name: Set date variable
        id: set-date
        if:  ${{ github.event_name == 'pull_request' }}
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set up cAdvisor for basic container monitoring
        run: |
          # Run cAdvisor container
          docker run -d \
            --volume=/:/rootfs:ro \
            --volume=/var/run:/var/run:ro \
            --volume=/var/run/docker.sock:/var/run/docker.sock:ro \
            --volume=/sys:/sys:ro \
            --volume=/var/lib/docker/:/var/lib/docker:ro \
            --volume=/dev/disk/:/dev/disk:ro \
            --publish=8080:8080 \
            --privileged=true \
            --detach=true \
            --name=cadvisor \
            gcr.io/cadvisor/cadvisor:latest

          # Wait for cAdvisor to initialize
          sleep 5

          # Create metrics directory
          mkdir -p ./system-tests/tests/load/cre/metrics

          # Start collecting metrics every 10 seconds
          echo "Starting metrics collection..."
          (while true; do
            timestamp=$(date +%s)
            curl -s http://localhost:8080/api/v1.3/containers/ > ./system-tests/tests/load/cre/metrics/cadvisor-${timestamp}.json
            sleep 10
          done) &
          echo $! > ./system-tests/tests/load/cre/metrics/metrics-pid.txt

      - name: Start the test
        shell: bash
        env:
          E2E_JD_IMAGE: "${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/job-distributor"
          E2E_JD_VERSION: "0.9.0"
          E2E_TEST_CHAINLINK_IMAGE: "${{ secrets.QA_AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/chainlink"
          E2E_TEST_CHAINLINK_VERSION: ${{ github.event_name == 'pull_request' && format('nightly-{0}-plugins-testing', steps.set-date.outputs.date) || inputs.chainlink_image_tag }}
          # Anvil developer key, not a secret
          PRIVATE_KEY: "ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          CTF_CONFIGS: "workflow-don-benchmark-ci.toml"
          LOAD_TEST: "true"
          CI: "true"
          GH_SHA: ${{ github.sha }}
        run: |
          cd system-tests/tests/load/cre
          go test -run TestLoad_Workflow_Streams_MockCapabilities -timeout 15m

      - name: Set up cAdvisor for basic container monitoring
        shell: bash
        run: |
          # Run cAdvisor container
          docker run -d \
            --volume=/:/rootfs:ro \
            --volume=/var/run:/var/run:ro \
            --volume=/var/run/docker.sock:/var/run/docker.sock:ro \
            --volume=/sys:/sys:ro \
            --volume=/var/lib/docker/:/var/lib/docker:ro \
            --volume=/dev/disk/:/dev/disk:ro \
            --publish=8080:8080 \
            --privileged=true \
            --detach=true \
            --name=cadvisor \
            gcr.io/cadvisor/cadvisor:latest
          
          # Wait for cAdvisor to initialize
          sleep 5
          
          # Debug what cAdvisor sees
          echo "=== Docker containers (from docker) ==="
          docker ps --format "{{.Names}} ({{.ID}})"
          
          echo "=== cAdvisor API status ==="
          curl -s http://localhost:8080/api/v1.3/ | jq '.'
          
          echo "=== cAdvisor root containers ==="
          curl -s http://localhost:8080/api/v1.3/containers/ | jq 'keys'
          
          echo "=== cAdvisor Docker containers ==="
          curl -s http://localhost:8080/api/v1.3/containers/docker/ > cadvisor-docker-debug.json
          cat cadvisor-docker-debug.json | jq '.subcontainers | map({name: .name, aliases: .aliases})'
          
          echo "=== Permission check on docker.sock ==="
          ls -la /var/run/docker.sock
          
          # Create metrics directory
          mkdir -p ./system-tests/tests/load/cre/metrics
          
          # Save debug info to file
          curl -s http://localhost:8080/api/v1.3/containers/ | jq '.' > ./system-tests/tests/load/cre/metrics/cadvisor-debug-full.json
          docker ps -a --format "{{json .}}" > ./system-tests/tests/load/cre/metrics/docker-containers.json
          
          # Start collecting metrics every 10 seconds
          echo "Starting metrics collection..."
          (while true; do
            timestamp=$(date +%s)
            curl -s http://localhost:8080/api/v1.3/containers/ > ./system-tests/tests/load/cre/metrics/cadvisor-${timestamp}.json
            sleep 10
          done) &
          echo $! > ./system-tests/tests/load/cre/metrics/metrics-pid.txt

      - name: Stop metrics collection
        if: always()
        run: |
          if [ -f ./system-tests/tests/load/cre/metrics/metrics-pid.txt ]; then
            kill -9 $(cat ./system-tests/tests/load/cre/metrics/metrics-pid.txt) || true
          fi
          docker stop cadvisor || true

      - name: Upload node logs and metrics as artifact
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: node logs
          path: |
            ./system-tests/tests/load/cre/logs/*.log
            ./system-tests/tests/load/cre/logs/**/*.log
            ./system-tests/tests/load/cre/logs/**/logs/
            ./system-tests/tests/load/cre/metrics/
          retention-days: 1
