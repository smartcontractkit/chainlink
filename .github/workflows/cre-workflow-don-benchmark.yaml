#        if:  ${{ github.event_name == 'pull_request' }}
#        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
#
      - name: Download and start Node Exporter
        shell: bash
        run: |
          # download
          wget https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-amd64.tar.gz
          
          # unpack
          tar xvfz node_exporter-1.9.1.linux-amd64.tar.gz
          
          # enter directory and launch in background
          cd node_exporter-1.9.1.linux-amd64
          ./node_exporter &
          
          # confirm it's running
          sleep 1
          pgrep -f node_exporter || (echo "Node Exporter failed to start" >&2; exit 1)

      - name: Wait for metrics
        run: |
          echo "Waiting up to 30s for Node Exporter metrics…"
          if timeout 30s bash -c 'until curl -sf http://localhost:9100/metrics; do sleep 1; done'; then
            echo "Metrics endpoint is up"
          else
            echo "Metrics endpoint did not start within 30s" >&2
            exit 1
          fi

#      - name: Start the test
#        shell: bash
#        env:
#          E2E_JD_IMAGE: "${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/job-distributor"
#          E2E_JD_VERSION: "0.9.0"
#          E2E_TEST_CHAINLINK_IMAGE: "${{ secrets.QA_AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ secrets.QA_AWS_REGION }}.amazonaws.com/chainlink"
#          E2E_TEST_CHAINLINK_VERSION: ${{ github.event_name == 'pull_request' && format('nightly-{0}-plugins-testing', steps.set-date.outputs.date) || inputs.chainlink_image_tag }}
#          # Anvil developer key, not a secret
#          PRIVATE_KEY: "ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
#          CTF_CONFIGS: "workflow-don-benchmark-ci.toml"
#          LOAD_TEST: "true"
#          CI: "true"
#          GH_SHA: ${{ github.sha }}
#        run: |
#          cd system-tests/tests/load/cre
#          go test -run TestLoad_Workflow_Streams_MockCapabilities -timeout 15m

      - name: Create Prometheus config
        shell: bash
        run: |
          cat > prometheus.yml<<EOF
          global:
            scrape_interval: 5s
          
          scrape_configs:
            - job_name: 'node-exporter'
              static_configs:
                - targets: ['host.docker.internal:9100']
          EOF

      - name: Start Prometheus
        shell: bash
        run: |
          docker run -d \
            --name prometheus \
            -p 9090:9090 \
            -v ${{ github.workspace }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
            prom/prometheus:latest \
            --config.file=/etc/prometheus/prometheus.yml

      - name: Start test container for metrics validation
        run: |
          docker run -d --name test-nginx nginx

      - name: Sleep for 10 seconds
        run: sleep 10

      - name: Fetch a sample of metrics
        run: |
          curl -sf "http://localhost:9090/api/v1/label/cgroup/values"

      - name: Upload node logs and metrics as artifact
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: node logs
          path: |
            system-tests/tests/load/cre/logs
          retention-days: 1

      - name: Teardown
        if: always()
        run: |
          docker rm -f node-exporter prometheus test-nginx
