name: Integration In-Memory Tests
run-name: Integration In-Memory Tests

on:
  merge_group:
  pull_request:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      cl_ref:
        description: "The ref to checkout, defaults to the calling branch"
        required: false
        type: string
  workflow_call:
    inputs:
      chainlink_version:
        description: "The version of Chainlink repository to use for the tests. If empty, defaults to github.sha."
        required: false
        type: string
        default: ""
      slack_channel_id:
        description: "Slack channel ID to notify test results"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.ref }}-${{ github.repository }}-${{ github.event_name }}--integration-tests
  cancel-in-progress: true

jobs:
  changes:
    environment:
      name: integration
      deployment: false
    name: Check Paths That Require Tests To Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'dependabot[bot]' && github.event_name != 'workflow_call' && github.event_name != 'workflow_dispatch'
    outputs:
      run-tests: ${{ steps.advanced-triggers.outputs.run-tests }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: smartcontractkit/chainlink
          ref: ${{ inputs.chainlink_version || inputs.cl_ref || github.sha }}

      - name: Advanced Triggers
        uses: smartcontractkit/.github/actions/advanced-triggers@advanced-triggers/v1
        id: advanced-triggers
        with:
          file-sets: |
            go-files:
              - "**/*.go"
              - "**/go.mod"
              - "**/go.sum"
            core-files:
              - "core/**"
            deployment-files:
              - "deployment/**"
            workflow-files:
              - ".github/workflows/integration-in-memory-tests.yml"
              - ".github/actions/**/*.y*ml"
            core-test-files:
              - "testdata/**"
              - "core/**/testdata/**"
              - "core/**/*_test.go"
            deployment-test-files:
              - "deployment/**/*_test.go"
              - "deployment/**/testdata/**"
            to-ignore-files:
              - "system-tests/**"
              - "devenv/**"
              - "core/scripts/cre/**"
          triggers: |
            run-tests:
              exclusion-sets: [ core-test-files, deployment-test-files, to-ignore-files ]
              inclusion-sets: [ go-files, core-files, deployment-files, workflow-files ]
              paths:
                - "integration-tests/**"
                - "**/*Dockerfile"
                - '**/ccip/**'
                - '**/*ccip*/**'

  define-test-matrix:
    name: Define Test Matrix
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.actor != 'dependabot[bot]' && !cancelled() && (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.run-tests == 'true')
    outputs:
      matrix: ${{ steps.define-matrix.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - name: Define test matrix
        id: define-matrix
        shell: bash
        run: |
          # shellcheck disable=SC1083,SC2016
          TESTS_JSON='[
          {"name": "ccip_migration_to_v_1_6_test.go", "test": "^TestMigrateFromV1_5ToV1_6$", "timeout": "12m", "parallel": 1, "plugins": false, "runs_on": "", "free_disk": false, "aptos": "", "sui": ""},
          {"name": "ccip_fees_test.go", "test": "^(Test_CCIPFees)$", "timeout": "20m", "parallel": 4, "plugins": false, "runs_on": "cpu=8/ram=32", "free_disk": false, "aptos": "", "sui": ""},
          {"name": "Test_CCIPMessaging_EVM2EVM", "test": "Test_CCIPMessaging_EVM2EVM", "timeout": "18m", "parallel": 4, "plugins": false, "runs_on": "cpu=8/ram=32", "free_disk": false, "aptos": "", "sui": ""},
