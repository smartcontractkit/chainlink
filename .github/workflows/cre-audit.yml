name: CRE Audit

# AI security/correctness audit for CRE capabilities. Each pack below gets its own
# `audit/<capability>` commit status. Audit logic, rubrics and findings live in
# smartcontractkit/cre-docs (.agents/skills/cre-audit); nothing sensitive is posted here.
#
#   /audit                         audit every pack whose paths this PR touches
#   /audit <pack>                  audit one pack
#   /audit [<pack>] skip <reason>  bypass (write access required)
#   model=opus|sonnet|haiku effort=low|medium|high|xhigh|max   optional overrides
#
# The pack→path map is read from the base branch (pull_request_target), so a PR cannot
# change which paths require an audit.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    # Invoked by cre-docs to stamp audit/<capability>; not meant to be run by hand.
    inputs:
      capability:
        description: Pack name
        required: true
        type: string
      pr_number:
        description: PR number
        required: true
        type: string
      head_sha:
        description: Audited commit SHA
        required: true
        type: string
      state:
        description: pending | success | failure | error
        required: true
        type: string
      description:
        description: Status description
        required: true
        type: string
      target_url:
        description: Link to the audit report
        required: false
        type: string

permissions: {}

jobs:
  audit:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       (startsWith(github.event.comment.body, '/audit') || startsWith(github.event.comment.body, '/vault-audit')))
    uses: smartcontractkit/.github/.github/workflows/cre-audit-consumer.yml@cre-audit/v1
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      statuses: write
    with:
      packs: |
        vault=^(core/capabilities/vault/|core/services/ocr2/plugins/vault/|core/services/gateway/handlers/vault/|core/services/workflows/v2/secrets\.go|system-tests/tests/smoke/cre/vault_don_test\.go|system-tests/tests/smoke/cre/vault_don_test_helpers\.go|system-tests/lib/cre/vault/)
      # Migration: also stamp the old required check and accept /vault-audit.
      # Remove once branch protection requires audit/vault instead of vault-audit.
      legacy_contexts: |
        vault=vault-audit
    secrets:
      GATI_AWS_ROLE_ARN: ${{ secrets.CHAINLINK_CRE_DOCS_GATI_AWS_ROLE_ARN }}
      GATI_AWS_LAMBDA_URL: ${{ secrets.CHAINLINK_CRE_DOCS_GATI_AWS_LAMBDA_URL }}
