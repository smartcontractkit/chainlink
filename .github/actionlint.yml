# See https://github.com/kjanat/actionlint/blob/main/docs/config.md

# Self-hosted / runs-on.com runner labels.
# Runs-on selectors (https://runs-on.com/) are `key=value` pairs; GitHub-hosted
# runners are matched exactly. Glob patterns are supported.
self-hosted-runner:
  labels:
    - ubuntu24.04-16cores-64GB
    - runs-on=*
    - cpu=*
    - ram=*
    - family=*
    - image=*
    - spot=*
    - volume=*
    - extras=*

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # ignore if: false, as it's a common pattern to temporarily disable a job or step
      - 'constant expression "false" in condition.*'
