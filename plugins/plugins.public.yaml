# This file defines public plugins to be installed via `loopinstall`.

# Common plugin configuration
defaults:
  # The `-s` flag is added to strip debug information from the binary to reduce
  # the binary size for releases.
  # See: `go tool link -help`
  goflags: "-ldflags=-s"

plugins:
  aptos:
    - moduleURI: "github.com/smartcontractkit/chainlink-aptos"
      gitRef: "v0.0.0-20260708114855-e953eeb028a7"
      installPath: "./cmd/chainlink-aptos"

  sui:
    - moduleURI: "github.com/smartcontractkit/chainlink-sui"
      # IMP: consult chainlink-sui team before updating this version
      # Must track the gRPC-migrated chainlink-sui used in go.mod, otherwise the DON runs a
      # pre-migration relayer (no gRPC ChainPoller) and never observes Sui source events.
      gitRef: "v0.0.0-20260821005832-e896796fceed"
      installPath: "./relayer/cmd/chainlink-sui"

  cosmos:
    - moduleURI: "github.com/smartcontractkit/chainlink-cosmos"
      gitRef: "v0.5.2-0.20260219133256-b46d473fd6f5"
      installPath: "./pkg/cosmos/cmd/chainlink-cosmos"
      # These will be copied into /usr/lib in the container.
      libs:
        - /go/pkg/mod/github.com/!cosm!wasm/wasmvm@v*/internal/api/libwasmvm.*.so

  feeds:
    - moduleURI: "github.com/smartcontractkit/chainlink-feeds"
      gitRef: "v0.1.2-0.20250227211209-7cd000095135"
      installPath: "./cmd/chainlink-feeds"

  solana:
    - moduleURI: "github.com/smartcontractkit/chainlink-solana"
      gitRef: "v1.3.1-0.20260803170030-90043607d911"
      installPath: "./pkg/solana/cmd/chainlink-solana"

  starknet:
    - moduleURI: "github.com/smartcontractkit/chainlink-starknet/relayer"
      gitRef: "5d83a289da752e966692a9f390970dbc86c95c7a" # chainlink-starknet develop (#695 merged)
      installPath: "./pkg/chainlink/cmd/chainlink-starknet"

  stellar:
    - moduleURI: "github.com/smartcontractkit/chainlink-stellar"
      gitRef: "32cdaf785e2395ccd43acddefc1e8a0c97ba5fad"
      installPath: "./cmd/chainlink-stellar"

  streams:
    - moduleURI: "github.com/smartcontractkit/chainlink-data-streams"
      gitRef: "v1.1.0"
      installPath: "./mercury/cmd/chainlink-mercury"

  ton:
    - moduleURI: "github.com/smartcontractkit/chainlink-ton"
      gitRef: "v1.0.5-0.20260629213843-c52e07523035"
      installPath: "./cmd/chainlink-ton"

  tron:
    - moduleURI: "github.com/smartcontractkit/chainlink-tron/relayer"
      gitRef: "v0.0.11-0.20260408092456-3c6369888d4a"
      installPath: "./cmd/chainlink-tron"

  evm:
    - moduleURI: "github.com/smartcontractkit/chainlink-evm"
      gitRef: "v0.3.4-0.20260810110946-8174b6bb7fc9"
      installPath: "./pkg/cmd/chainlink-evm"

  capability-cron:
    - moduleURI: "github.com/smartcontractkit/capabilities/cron"
      gitRef: "0de7433796544b33fd29c66d592b3a913d59f7e2"
      installPath: "."
      flags: "-tags timetzdata"

  capability-consensus:
    - moduleURI: "github.com/smartcontractkit/capabilities/consensus"
      gitRef: "0de7433796544b33fd29c66d592b3a913d59f7e2"
      installPath: "."

  capability-workflowevent:
    - enabled: false
      moduleURI: "github.com/smartcontractkit/capabilities/workflowevent"
      gitRef: "0de7433796544b33fd29c66d592b3a913d59f7e2"
      installPath: "."

  capability-httpaction:
    - moduleURI: "github.com/smartcontractkit/capabilities/http_action"
      gitRef: "0de7433796544b33fd29c66d592b3a913d59f7e2"
      installPath: "."

  capability-httptrigger:
    - moduleURI: "github.com/smartcontractkit/capabilities/http_trigger"
      gitRef: "0de7433796544b33fd29c66d592b3a913d59f7e2"
      installPath: "."

  capability-evm:
    - moduleURI: "github.com/smartcontractkit/capabilities/chain_capabilities/evm"
      gitRef: "0de7433796544b33fd29c66d592b3a913d59f7e2"
      installPath: "."

  capability-solana:
    - moduleURI: "github.com/smartcontractkit/capabilities/chain_capabilities/solana"
      gitRef: "0de7433796544b33fd29c66d592b3a913d59f7e2"
      installPath: "."

  capability-aptos:
    - moduleURI: "github.com/smartcontractkit/capabilities/chain_capabilities/aptos"
      gitRef: "0de7433796544b33fd29c66d592b3a913d59f7e2"
      installPath: "."

  capability-stellar:
    - moduleURI: "github.com/smartcontractkit/capabilities/chain_capabilities/stellar"
      gitRef: "37945e9e0fa41f14eaac47ad457cd6270b0ef0bf"
      installPath: "."

  confidential-http:
    - moduleURI: "github.com/smartcontractkit/chainlink-confidential-compute/enclave/apps/confidential-http/capability"
      gitRef: "9c9bdd52bec2622bf034f1020678d8bc30a3ced7"
      installPath: "./cmd/confidential-http"

  confidential-workflows:
    - moduleURI: "github.com/smartcontractkit/chainlink-confidential-compute/enclave/apps/confidential-workflows/capability"
      gitRef: "9c9bdd52bec2622bf034f1020678d8bc30a3ced7"
      installPath: "./cmd/confidential-workflows"
