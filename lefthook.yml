# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json
pre-commit:
  parallel: true
  commands:
    # Prevent committing secret keys or sensitive information
    betterleaks:
      tags: security
      run: betterleaks git . --pre-commit --staged
      fail_text: "betterleaks failed or missing. Install: go install github.com/betterleaks/betterleaks@latest"

    # Check for common typos in the codebase
    typos:
      tags: lint
      exclude:
        - "go.mod"
        - "go.sum"
        - "*.lock"
        - "package-lock.json"
        - "pnpm-lock.yaml"
      run: typos {staged_files}
      fail_text: "typos failed or missing. Install: brew install typos-cli (or cargo install typos-cli)"

    # Tidy go.mod/go.sum in parallel for changed modules
    go-mod-tidy:
      tags: gomod
      glob:
        - "**/*.go"
        - "**/go.mod"
        - "**/go.sum"
      run: go -C tools/githooks run . tidy {staged_files}
      stage_fixed: true

    # Regenerate code for changed packages (proto, config docs, go.md, mocks)
    go-generate:
      tags: generate
      glob:
        - "**/*.go"
        - "**/*.proto"
        - "**/go.mod"
        - "**/go.sum"
        - ".mockery.yaml"
        - "**/.mockery.yaml"
        - "**/generate.go"
        - "**/gen.go"
      run: go -C tools/githooks run . generate {staged_files}
      stage_fixed: true

    # Lint only changed modules + packages
    golangci-lint:
      tags: lint
      glob:
        - "**/*.go"
        - "**/go.mod"
        - "**/go.sum"
      run: go -C tools/githooks run . lint {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    short-tests:
      tags: test
      glob:
        - "**/*.go"
        - "**/go.mod"
        - "**/go.sum"
      run: go -C tools/githooks run . test {push_files}
