
[blockchain_a]
  chain_id = "1337"
  docker_cmd_params = ["-b", "5"]
  type = "anvil"

[infra]
  type = "crib"

  [infra.crib]
    folder_location = "/Users/ionita/crib/deployments/cre"
    namespace = "crib-workflow-don-load-test"
    provider = "aws"

    [infra.crib.team_input]
      component = "workflow-don"
      cost_center = "capabilities-df-migration-performance-tests"
      product = "workflow-don"
      team = "cre"

[jd]
  image = "job-distributor:0.9.0"

[[mock_capabilities]]
  description = "streams trigger mock"
  name = "streams-triggeer"
  type = "trigger"
  version = "2.0.0"

[[mock_capabilities]]
  description = "write trigger mock"
  name = "write_ethereum"
  type = "target"
  version = "1.0.0"

[[nodesets]]
  http_port_range_start = 10100
  name = "workflow"
  nodes = 17
  override_mode = "all"

  [nodesets.db]
    image = "postgres:12.0"
    port = 13000
    volume_name = "workflow_volume"

  [[nodesets.node_specs]]

    [nodesets.node_specs.node]
      image = "795953128386.dkr.ecr.us-west-2.amazonaws.com/chainlink:8ead5fcb3e5d44c6f68bcaec500b3543a708d3e1-plugins"
      user_config_overrides = "        [Feature]\n        LogPoller = true\n        FeedsManager = true\n        [OCR2]\n        Enabled = true\n        DatabaseTimeout = '1s'\n        [P2P.V2]\n        Enabled = true\n        ListenAddresses = ['0.0.0.0:5001']\n\t\t\t[LOG]\n\t\t\tLevel='debug'\n      "

[[nodesets]]
  http_port_range_start = 10200
  name = "capabilities"
