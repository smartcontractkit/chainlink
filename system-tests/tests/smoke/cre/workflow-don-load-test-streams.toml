[blockchain_a]
  chain_id = "1337"
  type = "anvil"
  docker_cmd_params = ["-b", "5"]

[binaries_config]
mock_capability_binary_path = "/Users/ionita/chainlink/plugins/amd64_mock"

[jd]
  image = "job-distributor:0.9.0"

[[mock_capabilities]]
  name="streams-triggeer"
  version= "2.0.0"
  type="trigger"
  description="streams trigger mock"

[[mock_capabilities]]
  name="write_ethereum"
  version= "1.0.0"
  type="target"
  description="write trigger mock"

[workflow_load]
  streams = 1000
  jobs = 2

[infra]
  type = "crib"

[infra.crib]
namespace = "crib-workflow-don-load-test"
folder_location = "/Users/ionita/crib/deployments/cre"
provider = "aws"

[infra.crib.team_input]
team="cre"
product="workflow-don"
component="workflow-don"
cost_center="capabilities-df-migration-performance-tests"

[[nodesets]]
nodes = 17
override_mode = "all"
http_port_range_start = 10100
name = "workflow"

[nodesets.db]
image = "postgres:12.0"
port = 13000
volume_name = "workflow_volume"

[[nodesets.node_specs]]
[nodesets.node_specs.node]
image = "795953128386.dkr.ecr.us-west-2.amazonaws.com/chainlink:pr-17294-e8367b7-plugins-amd64"
#image = "localhost:5001/chainlink:develop"
user_config_overrides = """
        [Feature]
        LogPoller = true
        FeedsManager = true
        [OCR2]
        Enabled = true
        DatabaseTimeout = '1s'
        [P2P.V2]
        Enabled = true
        ListenAddresses = ['0.0.0.0:5001']
      """
[[nodesets]]
nodes = 5
override_mode = "all"
http_port_range_start = 10200
name = "capabilities"

[nodesets.db]
