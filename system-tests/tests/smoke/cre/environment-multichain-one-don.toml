[[nodesets]]
  http_port_range_start = 10100
  name = "workflow"
  nodes = 5
  override_mode = "all"

  [nodesets.db]
    image = "postgres:12.0"
    port = 13000
    volume_name = "workflow_volume"

  [[nodesets.node_specs]]

    [nodesets.node_specs.node]
      image = "chainlink-tmp:latest"
      user_config_overrides = "            [Telemetry]\n            Enabled = true\n            Endpoint = 'host.docker.internal:4317'\n            InsecureConnection = true\n            TraceSampleRatio = 1\n\n            [Log]\n            Level = 'debug'\n            JSONConsole = true\n\n            [Feature]\n\t\t\tLogPoller = true\n\n\t\t\t[OCR2]\n\t\t\tEnabled = true\n\t\t\tDatabaseTimeout = '1s'\n\n\t\t\t[P2P.V2]\n\t\t\tEnabled = true\n\t\t\tListenAddresses = ['0.0.0.0:5001']\n      "

