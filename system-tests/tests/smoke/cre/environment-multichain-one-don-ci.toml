
# first one is the home chain
[[blockchains]]
  chain_id = "1337"
  port = "8545"
  type = "anvil"

[[blockchains]]
  chain_id = "2337"
  port = "8550"
  type = "anvil"

[custom_anvil_miner]
  block_speed_seconds = 5

[fake]
  port = 8171

[infra]
  type = "docker"

[jd]
  image = "injected-at-runtime"

[workflow_config]
  # feedIDs differ by one digit, look closely
  feed_ids = ["018e16c39e000320000000000000000000000000000000000000000000000000", "018e16c38e000320000000000000000000000000000000000000000000000000"]

  should_compile_new_workflow = false
  use_cre_cli = true

  workflow_folder_location = "../../../../../proof-of-reserves-workflow-e2e-test"
  workflow_name = "abcdefgasd"

  [workflow_config.dependencies]
    cre_cli_binary_path = "./cre_v0.1.5_darwin_arm64"
    cron_capability_binary_path = "./cron"

  [workflow_config.compiled_config]
    binary_url = "https://gist.githubusercontent.com/Tofel/1a2f6f7d9424bcb176a7cee31112bc11/raw/0e3859564f92c141cb856c65ef7a3db711588c08/binary.wasm.br.b64"
    # Every time that consumer address changes (e.g. due code sequence changes) we need to update the config used in CI. That config is identical to the one used, when executing local machine
    # unless test uses fake data provider. In that case the IP of the fake data provider will be different in the CI, because it uses linux not macOS operating system and that changes the IP
    # of 'host.docker.internal'. TL;DR is that when updating this config you can use config created during local execution, but you need to use data provider URL copied from the previous CI config.
    config_url = "https://gist.githubusercontent.com/Tofel/3905a87f22f105da5c0d7196ce7032c4/raw/63c982400f682a95580bf7b5b422aaf8ef4ba511/two_dons_config.json_03_04_2025"

[[nodesets]]
  http_port_range_start = 10100
  name = "workflow"
  nodes = 5
  override_mode = "all"

  [nodesets.db]
    image = "postgres:12.0"
    port = 13000
    volume_name = "workflow_volume"

  [[nodesets.node_specs]]

    [nodesets.node_specs.node]
      image = "injected-at-runtime"
      user_config_overrides = """
      [Feature]
			LogPoller = true

      [Log]
      Level = 'debug'
      JSONConsole = true

			[OCR2]
			Enabled = true
			DatabaseTimeout = '1s'

			[P2P.V2]
			Enabled = true
			ListenAddresses = ['0.0.0.0:5001']
      """