# Multi-chain PoR test configuration
# Anvil as home chain for Keystone contracts, Tron as secondary chain for write target

# Home chain - Anvil (for Keystone contracts)
[[blockchains]]
  chain_id = "31337"
  port = "8545"
  type = "anvil"

# Secondary chain - Tron (for write target)
[[blockchains]]
  chain_id = "728126428"  # Tron Mainnet chain ID  
  port = "9090"         # Tron JSON-RPC Full Node port
  type = "tron"          # Use Tron simulated backend

[fake]
  port = 8171

[infra]
  type = "docker"

[jd]
  csa_encryption_key = "d1093c0060d50a3c89c189b2e485da5a3ce57f3dcb38ab7e2c0d5f0bb2314a44" # any random 32 byte hex string
  image = "job-distributor:0.12.7"

[[workflow_configs]]
  feed_id = "018e16c39e000320000000000000000000000000000000000000000000000000"
  workflow_file_location = "../../../../core/scripts/cre/environment/examples/workflows/v1/proof-of-reserve/cron-based/main.go"

[dependencies]
  cron_capability_binary_path = "amd64_cron"

[[nodesets]]
  http_port_range_start = 10100
  name = "workflow"
  nodes = 5
  override_mode = "all"

  [nodesets.db]
    image = "postgres:12.0"
    port = 13000
    volume_name = "workflow_volume"

  [[nodesets.node_specs]]

    [nodesets.node_specs.node]
      docker_ctx = "../../../.."
      docker_file = "core/chainlink.Dockerfile"
      user_config_overrides = """
      [Log]
      Level = 'debug'
      JSONConsole = true

      # Remove this bit to allow downloading workflows from remote sources
      [CRE.WorkflowFetcher]
      URL = "file:///home/chainlink/workflows"
      
      # Home chain - Anvil (for Keystone contracts)
      [[EVM]]
      Enabled = true
      ChainID = '31337'
      FinalityTagEnabled = false
      LogBroadcasterEnabled = false
      FinalityDepth = 1
      LogPollInterval = '1s'
      NoNewHeadsThreshold = '3m0s'
      FinalizedBlockOffset = 0

      [[EVM.Nodes]]
      Name = 'primary'
      HTTPURL = 'http://host.docker.internal:8545'

      [EVM.BalanceMonitor]
      Enabled = true

      [EVM.GasEstimator]
      PriceMin = '1 gwei'
      LimitDefault = 6000000
      LimitMax = 6000000

      [EVM.NodePool]
      NewHeadsPollInterval = '1s'

      [EVM.HeadTracker]
      FinalityTagBypass = false
      
      # Secondary chain - Tron (for write target)
      [[EVM]]
      Enabled = true
      ChainID = '728126428'
      ChainType = 'tron'
      FinalityTagEnabled = false
      LogBroadcasterEnabled = false
      FinalityDepth = 1
      LogPollInterval = '10s'
      NoNewHeadsThreshold = '3m0s'
      FinalizedBlockOffset = 0

      [[EVM.Nodes]]
      Name = 'primary'
      HTTPURL = 'http://host.docker.internal:16671/jsonrpc'

      [EVM.BalanceMonitor]
      Enabled = true

      [EVM.GasEstimator]
      PriceMin = '210 wei'
      LimitDefault = 6000000
      LimitMax = 6000000

      [EVM.NodePool]
      NewHeadsPollInterval = '10s'

      [EVM.HeadTracker]
      FinalityTagBypass = false
      """

    [nodesets.node_specs.node.env_vars]
    CL_EVM_CMD="" 