
[blockchain_a]
  type = "anvil"
  chain_id = "1337"

[custom_anvil_miner]
  block_speed_seconds = 5

[jd]
  image = "injected-at-runtime"

[fake]
  port = 8171

[infra]
  # either "docker" or "crib"
  type = "docker"

[workflow_config]
	workflow_name = "abcdefgasd"
  # 0x01 8e16c39e 0000 20 0000000000000000 = ETH/USD Benchmark Price with 0 decimals
  feed_id = "018e16c39e000320000000000000000000000000000000000000000000000000"

  use_cre_cli = true
  should_compile_new_workflow = false

  [workflow_config.dependencies]
  cron_capability_binary_path = "./cron"
  cre_cli_binary_path = "./cre_v0.1.5_linux_amd64"

  [workflow_config.compiled_config]
    binary_url = "https://gist.githubusercontent.com/Tofel/83bfabf8f3240ebf37223cb506d45d9d/raw/344e9ca366a2fb47858565f125f0804a1c1fe12d/binary.wasm.br.b64"
    # Every time that consumer address changes (e.g. due code sequence changes) we need to update the config used in CI. That config is identical to the one used, when executing local machine
    # unless test uses fake data provider. In that case the IP of the fake data provider will be different in the CI, because it uses linux not macOS operating system and that changes the IP
    # of 'host.docker.internal'. TL;DR is that when updating this config you can use config created during local execution, but you need to use data provider URL copied from the previous CI config.
    config_url = "https://gist.githubusercontent.com/Tofel/0d7419a3cb94f653787de98efd097655/raw/8450e7b223696852e389efd3c67f8f95fd3dd738/two-dons-config-17-04-2025.json"
    secrets_url = "https://gist.githubusercontent.com/Tofel/8f2f96ce851d9729839b5f59fbfea318/raw/f06ba081bbbb34a7c440dbd1183b68c2ebd84b43/encrypted.secrets.json"

[[nodesets]]
  nodes = 5
  override_mode = "all"
  http_port_range_start = 10100
  name = "workflow"

  [nodesets.db]
    image = "postgres:12.0"
    port = 13000
    volume_name = "workflow_volume"

  [[nodesets.node_specs]]
    [nodesets.node_specs.node]
      image = "injected-at-runtime"
      # omitted on purpose, if not defined here it will be added by Go code if worker nodes from this DON have cron capability
      # capabilities = ['./cron']
      user_config_overrides = """
      [Feature]
			LogPoller = true

      [Log]
      Level = 'debug'
      JSONConsole = true

			[OCR2]
			Enabled = true
			DatabaseTimeout = '1s'

			[P2P.V2]
			Enabled = true
			ListenAddresses = ['0.0.0.0:5001']
      """

[[nodesets]]
  nodes = 1
  override_mode = "all"
  http_port_range_start = 10300
  name = "gateway"

  [nodesets.db]
    image = "postgres:12.0"
    port = 13200

  [[nodesets.node_specs]]
    [nodesets.node_specs.node]
      image = "injected-at-runtime"
      user_config_overrides = """
      [Feature]
			LogPoller = true

      [Log]
      Level = 'debug'
      JSONConsole = true

			[OCR2]
			Enabled = true
			DatabaseTimeout = '1s'

			[P2P.V2]
			Enabled = true
			ListenAddresses = ['0.0.0.0:5001']
      """