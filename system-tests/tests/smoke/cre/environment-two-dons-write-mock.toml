use_cre_cli = false
should_compile_new_workflow = false

[workflow_config.dependencies]
cron_capability_binary_path = "./amd64_cron"
cre_cli_binary_path = "./cre_v0.1.5_darwin_arm64"

[workflow_config.compiled_config]
