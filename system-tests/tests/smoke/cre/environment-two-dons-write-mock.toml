[blockchain_a]
chain_id = "1337"
type = "anvil"
docker_cmd_params = ["-b", "5"]

[jd]
# change to your version
image = "job-distributor:0.9.0"

[infra]
type = "crib"

[infra.crib]
namespace = "crib-write-don-load-test"
folder_location = "/Users/dh/go/src/github.com/smartcontractkit/crib/deployments/cre" # TODO change to your FOLDER
provider = "aws"

[infra.crib.team_input]
team="cre"
product="workflow-don"
component="workflow-don"
cost_center="capabilities-df-migration-performance-tests"

[workflow_config]
