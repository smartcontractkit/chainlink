        [Feature]
        LogPoller = true
        FeedsManager = true
        [OCR2]
        Enabled = true
        DatabaseTimeout = '1s'
        [P2P.V2]
        Enabled = true
        ListenAddresses = ['0.0.0.0:5001']
        [LOG]
        Level='debug'
      """