[blockchain_a]
chain_id = "1337"
type = "anvil"
docker_cmd_params = ["-b", "5"]

[binaries_config]
mock_capability_binary_path = "/Users/ionita/chainlink/plugins/amd64_mock"

[jd]
image = "job-distributor:0.9.0"

[[mock_capabilities]]
  name="streams-triggeer"
  version= "2.0.0"
  type="trigger"
  description="streams trigger mock"


[infra]
type = "crib"

[infra.crib]
namespace = "crib-writer-don-load-test-george"
folder_location = "/Users/ionita/crib/deployments/cre"
provider = "aws"

[infra.crib.team_input]
team="cre"
product="writer-don"
component="writer-don"
cost_center="capabilities-df-migration-performance-tests"

[[nodesets]]
nodes = 4
override_mode = "all"
http_port_range_start = 10100
name = "writer"

[nodesets.db]
image = "postgres:12.0"
port = 13000
volume_name = "workflow_volume"

[[nodesets.node_specs]]
[nodesets.node_specs.node]
image = "795953128386.dkr.ecr.us-west-2.amazonaws.com/chainlink:b957388c92f7b455338a6fd2c48ec70ee08b4dea-plugins"
#image = "localhost:5001/chainlink:develop"
user_config_overrides = """
        [Feature]
        LogPoller = true
        FeedsManager = true
        [OCR2]
        Enabled = true
        DatabaseTimeout = '1s'
        [P2P.V2]
        Enabled = true
        ListenAddresses = ['0.0.0.0:5001']
        [LOG]
        Level='debug'
      """
